  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 28px 16px 60px;
    position: relative;
    z-index: 1;
  }
  h1, h2, h3, .display {
    font-family: 'Rye', serif;
    font-weight: 400;
    letter-spacing: 0.01em;
    margin: 0;
  }
  .crest-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 18px;
  }
  .crest-wrap img {
    width: 168px;
    height: 168px;
    object-fit: contain;
    margin-bottom: 10px;
  }
  .crest-wrap h1 { font-size: 21px; color: var(--white-strong); line-height: 1.3; }
  .crest-wrap .sub { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; font-family: 'IBM Plex Sans', sans-serif; letter-spacing: 0.04em; }
  .ring-divider {
    height: 5px;
    border-top: 1px solid var(--line-strong);
    border-bottom: 1px solid var(--line);
    margin: 20px 0;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .event-card {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .event-card:active { background: var(--surface-alt); }
  .event-card .name { font-size: 18px; font-family: 'Rye', serif; font-weight: 400; color: var(--white-strong); padding-right: 56px; }
  .event-card .meta { font-size: 12px; color: var(--text-muted); margin-top: 5px; font-family: 'IBM Plex Sans', sans-serif; }
  .event-card .arrow { color: var(--text-muted); font-size: 20px; font-family: 'IBM Plex Sans', sans-serif; }
  .event-date-badge {
    position: absolute;
    top: 12px;
    right: 14px;
    font-size: 10.5px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    padding: 2px 7px;
  }
  .empty {
    text-align: center;
    padding: 40px 16px;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.7;
  }
  .btn {
    display: inline-block;
    background: var(--white-strong);
    color: #0A0A0A;
    border: 1px solid var(--white-strong);
    border-radius: var(--radius);
    padding: 12px 18px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    cursor: pointer;
    text-align: center;
  }
  .btn:active { opacity: 0.8; }
  .btn.secondary {
    background: transparent;
    border: 1px solid var(--line-strong);
    color: var(--text);
  }
  .btn.ghost {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    text-decoration: underline;
    padding: 8px 0;
  }
  .btn.block { display: block; width: 100%; }
  .btn.danger { background: transparent; border: 1px solid var(--danger-line); color: #C9A29C; }
  .row-gap { display: flex; gap: 8px; flex-wrap: wrap; }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-muted);
    font-size: 13.5px;
    margin-bottom: 18px;
    cursor: pointer;
  }
  /* Para elementos que ficam direto sobre a foto de fundo, sem um card solido
     atras: ganham uma base escura propria para nao perder contraste. */
  .on-photo {
    background: var(--surface);
    border-radius: var(--radius);
  }
  .back-link.on-photo,
  .btn.ghost.on-photo {
    border: 1px solid var(--line);
    padding: 8px 14px;
    text-decoration: none;
  }
  /* .btn.ghost e .btn.secondary tem duas classes cada, o que da mais peso do
     que .on-photo sozinha - sem isso, o fundo transparente delas vencia e so
     a borda aparecia. */
  .btn.ghost.on-photo,
  .btn.secondary.on-photo {
    background: var(--surface);
  }
  input, select, textarea {
    width: 100%;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: var(--radius);
    padding: 11px 12px;
    font-size: 15px;
    font-family: 'IBM Plex Sans', sans-serif;
    margin-bottom: 10px;
  }
  input:focus { outline: 1px solid var(--line-strong); }
  textarea { resize: vertical; font-family: 'IBM Plex Sans', sans-serif; }
  .info-line { font-size: 14px; color: var(--text); padding: 4px 0; line-height: 1.5; }
  label {
    font-size: 12px;
    color: var(--text-muted);
    display: block;
    margin-bottom: 5px;
    letter-spacing: 0.02em;
  }
  .field { margin-bottom: 14px; }
  .date-hint {
    margin-top: 4px;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--text-muted);
  }
  .event-header {
    margin-bottom: 18px;
  }
  .event-header h1 { font-size: 22px; color: var(--white-strong); }
  .event-header .count-box {
    display: inline-block;
    border: 1px solid var(--line-strong);
    padding: 2px 8px;
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'IBM Plex Sans', sans-serif;
    letter-spacing: 0.03em;
    margin-top: 6px;
    border-radius: var(--radius);
  }
  .event-header-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .event-header-row .count-box { margin-top: 0; }
  .confirm-toggle-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1px solid var(--white-strong);
    background: transparent;
    color: var(--white-strong);
    padding: 2px 10px;
    font-size: 12px;
    font-weight: 600;
    font-family: 'IBM Plex Sans', sans-serif;
    letter-spacing: 0.02em;
    border-radius: var(--radius);
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .confirm-toggle-btn:active { opacity: 0.8; }
  .confirmado-divisao { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  .member-row {
    border-bottom: 1px solid var(--line);
    padding: 13px 0;
  }
  .member-row:last-child { border-bottom: none; }
  .division-subheader {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px 12px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    padding: 16px 0 6px;
  }
  .division-subheader:first-child { padding-top: 4px; }
  .division-subheader.clicavel { cursor: pointer; }
  .division-subheader.clicavel:active { opacity: 0.7; }
  .division-counts {
    font-weight: 500;
    letter-spacing: normal;
    font-variant-numeric: tabular-nums;
  }
  .division-counts b { color: var(--white-strong); font-weight: 700; }
  .member-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    gap: 10px;
  }
  .member-info-wrap { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .member-info { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .member-num { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .member-name { font-size: 15.5px; font-weight: 500; color: var(--text); }
  .member-funcoes {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 11.5px;
    color: var(--text-muted);
  }
  .member-funcoes .funcao-item { display: inline-flex; align-items: center; gap: 3px; }
  .grade-box {
    display: inline-block;
    border: 1px solid var(--line-strong);
    padding: 0px 6px;
    font-size: 10.5px;
    color: var(--text-muted);
    font-family: 'IBM Plex Sans', sans-serif;
    letter-spacing: 0.03em;
    border-radius: var(--radius);
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .status-aguardando { color: var(--text-muted); border: 1px dashed var(--line-strong); background: transparent; }
  .status-confirmado { color: #0A0A0A; background: var(--white-strong); border: 1px solid var(--white-strong); font-weight: 700; }
  .status-falta { color: var(--text-muted); background: var(--surface-alt); border: 1px solid var(--line); text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .status-familia { color: var(--text-muted); background: var(--surface-alt); border: 1px solid var(--line); text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .status-trabalho { color: var(--text-muted); background: var(--surface-alt); border: 1px solid var(--line); text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .picker {
    margin-top: 12px;
    padding: 12px;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    display: none;
  }
  .picker.open { display: block; }
  .picker-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .picker-btn {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    padding: 10px 8px;
    border-radius: var(--radius);
    font-size: 13.5px;
    font-family: 'IBM Plex Sans', sans-serif;
    cursor: pointer;
    text-align: left;
  }
  .picker-btn.active { border-color: var(--white-strong); background: rgba(245,243,236,0.08); }
  .toggle-row { display: flex; gap: 6px; }
  .toggle-chip {
    flex: 1;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-muted);
    padding: 8px 4px;
    border-radius: var(--radius);
    font-size: 11.5px;
    cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .toggle-chip.active { color: var(--text); border-color: var(--line-strong); background: rgba(255,255,255,0.06); }
  .legend {
    margin-top: 24px;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 2;
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
  .pin-input {
    text-align: center;
    font-size: 24px;
    letter-spacing: 10px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-size: 13px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    cursor: pointer;
  }
  .tab.active { color: var(--white-strong); border-color: var(--white-strong); }
  /* So pra tela de Relatorios, que tem mais abas (7) do que cabe numa linha
     so - quebra em varias linhas em vez de espremer o texto, sem mexer no
     .tabs/.tab padrao (usado tambem pelo Modo organizador, com menos abas). */
  .tabs-wrap { flex-wrap: wrap; }
  .tabs-wrap .tab { flex: 1 1 30%; min-width: 90px; padding: 8px 6px; font-size: 12px; }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14.5px;
  }
  .checkbox-row:last-child { border-bottom: none; }
  .checkbox-row input { width: auto; margin: 0; }
  .count-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
  .count-box-report {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 10px;
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .count-box-report b { color: var(--white-strong); font-size: 13.5px; }
  .presenca-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 14px 16px;
  }
  .presenca-nome { font-size: 15px; font-weight: 500; color: var(--text); }
  .presenca-contagem { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .presenca-sem-dados { font-size: 12px; color: var(--text-muted); font-style: italic; }
  .presenca-pct-wrap { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .presenca-barra {
    width: 64px;
    height: 6px;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .presenca-barra-fill { height: 100%; background: var(--white-strong); }

  /* Grafico de barras horizontal (aba Presenca > % por evento) e o medidor de
     % total - mesma linguagem visual das barras de presenca por membro
     acima (trilho em --surface-alt, preenchimento em --white-strong), so
     maior. Ponta arredondada so no lado que cresce; a base fica quadrada. */
  .chart-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .chart-row-label { flex: 1 1 auto; min-width: 0; font-size: 12.5px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chart-row-track { flex: 1 1 55%; height: 16px; background: var(--surface-alt); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .chart-row-fill { height: 100%; background: var(--white-strong); border-radius: 0 var(--radius) var(--radius) 0; }
  .chart-row-value { flex: 0 0 auto; width: 40px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; color: var(--white-strong); }
  .relatorio-tabela { width: 100%; border-collapse: collapse; font-size: 13px; }
  .relatorio-tabela th { text-align: left; color: var(--text-muted); font-weight: 500; padding: 6px 4px; border-bottom: 1px solid var(--line-strong); }
  .relatorio-tabela td { padding: 7px 4px; border-top: 1px solid var(--line); color: var(--text); }
  .relatorio-tabela td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--white-strong); font-weight: 600; }

  /* Donut de status (aba Presenca > % total do periodo). Paleta pequena e
     fixa (nao categorica generica) porque as 4 fatias sao ESTADOS, nao
     identidades soltas - mesma logica de verde/amarelo/vermelho que a
     planilha ja usa no semaforo da aba Regional (corSemaforo no Code.gs),
     so recalibrada pra ficar legivel no fundo escuro do app. */
  :root {
    --status-confirmado: #5FC98D;
    --status-aguardando: #9C9890;
    --status-justificada: #E0B24D;
    --status-infracional: #D9635A;
  }
  .donut-wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .donut-legend { display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; flex: 1 1 160px; min-width: 150px; }
  .donut-legend-item { display: flex; align-items: center; gap: 8px; }
  .donut-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .donut-legend-label { color: var(--text); }
  .donut-legend-value { color: var(--text-muted); margin-left: auto; font-variant-numeric: tabular-nums; padding-left: 8px; }
  .donut-card { margin-bottom: 14px; }
  .donut-card-total { text-align: center; }
  .donut-card-total .donut-wrap { justify-content: center; }
  .donut-card-total .donut-legend { flex: 0 1 220px; text-align: left; }
  .donut-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .presenca-pct {
    font-size: 15px;
    font-weight: 700;
    color: var(--white-strong);
    font-variant-numeric: tabular-nums;
    min-width: 36px;
    text-align: right;
  }
  .chip-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 14px; }
  .chip-grid.wide { grid-template-columns: repeat(2, 1fr); }
  .chip-option {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-muted);
    padding: 9px 6px;
    border-radius: var(--radius);
    font-size: 13px;
    font-family: 'IBM Plex Sans', sans-serif;
    cursor: pointer;
    text-align: center;
  }
  .chip-option.active { color: #0A0A0A; background: var(--white-strong); border-color: var(--white-strong); font-weight: 600; }
  .footer-admin { text-align: center; margin-top: 34px; }
  .footer-admin .brand-tag { font-size: 10.5px; color: var(--line-strong); letter-spacing: 0.08em; margin-top: 14px; font-family: 'IBM Plex Sans', sans-serif; }
  .loading { text-align: center; padding: 60px 0; color: var(--text-muted); font-size: 14px; }
  .alert {
    border: 1px solid var(--danger-line);
    border-left-width: 3px;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .alert.info { border-color: var(--line-strong); }
  .alert.ok { border-color: var(--white-strong); }
  .alert-title {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--white-strong);
    margin-bottom: 4px;
  }
  .alert-msg { font-size: 12.5px; color: var(--text-muted); line-height: 1.6; }
  .member-row.travado { opacity: 0.4; pointer-events: none; }

  /* Revisao da convocacao colada - cards empilhados em vez de tabela, pra
     nao depender de scroll horizontal em celular (a tabela antiga tinha 4
     colunas e um <select> dentro, ruim de usar com o dedo). */
  .revisao-row { padding: 10px 0; border-top: 1px solid var(--line); }
  .revisao-row:first-child { border-top: none; }
  .revisao-row.ignorado { opacity: .5; }
  .revisao-row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .revisao-nome { font-size: 14px; color: var(--white-strong); }
  .revisao-status { font-size: 12.5px; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }
  .revisao-row-bottom { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .revisao-row-bottom select { flex: 1 1 180px; min-width: 0; }
  .revisao-sugestoes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .revisao-sugestoes .chip-option { padding: 4px 10px; font-size: 12px; }
</style>
</head>

// CONFIGURACAO DA RJ4
// Cada item vira um botao proprio no Modo organizador, com o proprio PIN
// (guardado no Code.gs, nao aqui - ver verificarPin). A chave e o que fica
// gravado como categoria dos eventos e divisao dos membros criados dali.
// Para acrescentar uma divisao nova, e so um item a mais nesta lista, mais
// o PIN dela nas Propriedades do Script - nao precisa mexer em mais nada.
// ========================================================================
const CLUBE_NOME = 'Insanos MC';
const ESCOPOS = [
  { chave: 'barra', nome: 'Barra - RJ4' },
  { chave: 'oeste', nome: 'Oeste - RJ4' },
  { chave: 'recreio', nome: 'Recreio - RJ4' },
  { chave: 'curicica', nome: 'Curicica - RJ4' },
  { chave: 'taquara', nome: 'Taquara - RJ4' },
  { chave: 'gardenia', nome: 'Gardênia - RJ4' },
  { chave: 'regional', nome: 'Regional RJ4' },
];
function escopoPorChave(chave) { return ESCOPOS.find(e => e.chave === chave) || ESCOPOS[0]; }

// Ordem pra listar as divisoes nas telas (organizador, tela inicial, rank):
// Regional no topo, depois as demais em ordem alfabetica do nome. Separado
// da ordem de declaracao de ESCOPOS, que fica com Barra primeiro por ser o
// valor padrao seguro (escopoPorChave cai nela se receber uma chave invalida).
function escoposEmOrdemDeExibicao() {
  return [...ESCOPOS].sort((a, b) => {
    if (a.chave === 'regional') return -1;
    if (b.chave === 'regional') return 1;
    return a.nome.localeCompare(b.nome);
  });
}

// So as 6 divisoes, sem Regional - o Insight e coisa de quem esta na base,
// nao da diretoria regional (ver calcularEstatisticasInsights no Code.gs).
function divisoesSemRegional() {
  return escoposEmOrdemDeExibicao().filter(e => e.chave !== 'regional');
}

// So Regional e Barra na tela de Relatorios (decisao do clube) - Modo
// organizador e a tela inicial continuam com as 7 divisoes normalmente
// (escoposEmOrdemDeExibicao). Nada e apagado no backend/planilha, e so
// filtro de exibicao aqui.
function escoposAtivos() {
  return escoposEmOrdemDeExibicao().filter(e => e.chave === 'regional' || e.chave === 'barra');
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

const API_URL = 'https://script.google.com/macros/s/AKfycbyotQH6FypFdkC6D42WQHszNiuG29wqIBal2jBcwXdoCsT-Om_0gyDxFE02hxfwrZegxw/exec';

// A API do Apps Script leva de 2 a 4s numa conexao boa. No 4G do celular
// passa disso com folga, entao o limite precisa ser generoso.
const READ_TIMEOUT = 20000;
const READ_RETRIES = 2;

function jsonp(url, timeoutMs) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    let timer = null;
    const cleanup = () => {
      clearTimeout(timer);
      delete window[cbName];
      script.remove();
    };
    window[cbName] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('Falha de conexao')); };
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
    document.body.appendChild(script);
    timer = setTimeout(() => {
      if (window[cbName]) { cleanup(); reject(new Error('A conexao demorou demais')); }
    }, timeoutMs);
  });
}

// Leitura e gravacao passam pelo mesmo caminho: o backend responde confirmando
// a operacao, entao nao e mais preciso gravar as cegas e reler para conferir.
// Lanca em caso de falha, em vez de devolver vazio - devolver vazio fazia o app
// confundir "nao consegui ler" com "nao tem nada salvo".
async function api(action, params) {
  const query = Object.keys(params || {})
    .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k]))
    .join('&');
  const url = API_URL + '?action=' + encodeURIComponent(action) + (query ? '&' + query : '');

  let ultimoErro;
  for (let tentativa = 0; tentativa <= READ_RETRIES; tentativa++) {
    try {
      const r = await jsonp(url, READ_TIMEOUT);
      if (!r || !r.ok) throw new Error((r && r.erro) || 'A planilha recusou a operação');
      return r;
    } catch (e) {
      ultimoErro = e;
      console.error('Falha em', action, 'tentativa', tentativa + 1, e);
    }
  }
  throw ultimoErro;
}

// Rede de seguranca para quando a pagina esta sendo fechada: o sendBeacon e
// entregue pelo navegador mesmo depois da aba morrer. Nao da para conferir o
// resultado, mas e melhor que perder a marcacao.
function apiBeacon(action, params) {
  if (!navigator.sendBeacon) return false;
  const corpo = JSON.stringify(Object.assign({ action: action }, params));
  return navigator.sendBeacon(API_URL, new Blob([corpo], { type: 'text/plain;charset=utf-8' }));
}

// Usado so pela importacao de convocacao colada: o payload (lista de membros
// com status) pode passar do limite pratico de tamanho de uma URL de GET, ja
// que o api() normal manda tudo como query string. O doGet/doPost no Code.gs
// caem na mesma funcao executar(), entao o backend nao muda - so troca o
// transporte para um corpo JSON de verdade.
async function apiPost(action, params) {
  // Sem header de Content-Type de proposito: o fetch entao manda como
  // "text/plain" (o mesmo que o sendBeacon acima ja usa), que o navegador
  // trata como requisicao simples e nao dispara preflight OPTIONS - o Apps
  // Script nao responde a OPTIONS, entao um POST com Content-Type
  // "application/json" explicito falharia por CORS.
  const r = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(Object.assign({ action: action }, params))
  });
  const data = await r.json();
  if (!data || !data.ok) throw new Error((data && data.erro) || 'A planilha recusou a operação');
  return data;
}

// Usado nas telas do organizador, onde quem grava e uma pessoa so e um aviso
// direto resolve.
async function salvarOuAvisar(action, params) {
  try {
    return await api(action, params);
  } catch (e) {
    alert('Não consegui salvar na planilha.\n\n' + e.message + '.\n\nVerifique sua conexão e tente de novo.');
    await loadInitial();
    return null;
  }
}

async function loadInitial() {
  state.loading = true;

  render();
  try {
    const r = await api('dados');
    state.roster = r.membros || [];
    state.events = r.eventos || [];
  } catch (e) {
    state.loadError = e.message;
  }
  state.loading = false;
  render();
}

async function loadEventStatus(eventId) {
  state.statusLoaded = false;
  state.statusError = null;
  render();
  try {
    const r = await api('presencas', { eventoId: eventId });
    if (state.currentEventId !== eventId) return;
    state.currentStatus = r.presencas || {};
    state.statusLoaded = true;
  } catch (e) {
    if (state.currentEventId !== eventId) return;
    state.statusError = e.message;
  }
  render();
}

function getMemberStatus(memberId) {
  return state.currentStatus[memberId] || { status: 'aguardando', direto: false, destacado: false, acompanhado: false };
}

// A tela responde na hora e a gravacao corre por fora. Toques seguidos
// (status, depois Direto, depois Destacado) sao agrupados numa gravacao so.
const ESPERA_AGRUPAR = 600;
let timerGravacao = null;
let gravacaoEmCurso = false;
// Cada pendencia guarda um membro so, com o proprio eventId. Antes o app
// mandava a lista inteira de volta, e quem gravasse por ultimo apagava a
// confirmacao de quem tinha gravado antes.
let pendentes = {};

function chavePendencia(eventId, memberId) { return eventId + '|' + memberId; }

function setMemberStatus(memberId, patch) {
  // Sem a leitura confirmada, state.currentStatus pode estar vazio por falha de
  // rede, e a tela mostraria um estado que nao e o real.
  if (!state.statusLoaded) return;

  const atualizado = { ...getMemberStatus(memberId), ...patch };
  state.currentStatus = { ...state.currentStatus, [memberId]: atualizado };
  state.saveSeq++;
  state.saveState = 'saving';
  pendentes[chavePendencia(state.currentEventId, memberId)] = {
    eventoId: state.currentEventId,
    membroId: memberId,
    dados: atualizado
  };
  render();

  clearTimeout(timerGravacao);
  timerGravacao = setTimeout(gravarPendentes, ESPERA_AGRUPAR);
}

// Os parametros trafegam pela URL, entao a lista de participantes vai como
// texto separado por virgula e so os campos que o backend usa sao enviados.
function paramsDeEvento(ev) {
  return {
    id: ev.id,
    nome: ev.nome,
    data: ev.data || '',
    horario: ev.horario || '',
    endereco: ev.endereco || '',
    outros: ev.outros || '',
    status: ev.status || 'ativo',
    categoria: ev.categoria || 'barra',
    tipo: ev.tipo || '',
    membroIds: (ev.memberIds || []).join(',')
  };
}

function paramsDePresenca(p) {
  return {
    eventoId: p.eventoId,
    membroId: p.membroId,
    status: p.dados.status || 'aguardando',
    direto: !!p.dados.direto,
    destacado: !!p.dados.destacado,
    acompanhado: !!p.dados.acompanhado
  };
}

async function gravarPendentes() {
  if (gravacaoEmCurso) {
    clearTimeout(timerGravacao);
    timerGravacao = setTimeout(gravarPendentes, ESPERA_AGRUPAR);
    return;
  }
  const chaves = Object.keys(pendentes);
  if (!chaves.length) return;

  gravacaoEmCurso = true;
  const falhou = [];
  try {
    for (const chave of chaves) {
      const p = pendentes[chave];
      try {
        await api('presenca', paramsDePresenca(p));
        // So sai da fila se a mesma marcacao ainda estiver pendente: se o
        // membro mexeu de novo enquanto gravava, a nova versao fica.
        if (pendentes[chave] === p) delete pendentes[chave];
      } catch (e) {
        falhou.push(chave);
      }
    }
  } finally {
    gravacaoEmCurso = false;
  }

  state.saveState = falhou.length ? 'error' : 'saved';
  render();
  if (!falhou.length) {
    const seq = state.saveSeq;
    setTimeout(() => {
      if (seq === state.saveSeq && state.saveState === 'saved') {
        state.saveState = 'idle';
        render();
      }
    }, 2000);
  }
}

// Regera a aba Relatorio da planilha. Fica fora do caminho da confirmacao de
// propósito: gerar junto com cada marcacao dobrava o tempo que o membro espera.
async function gerarRelatorio() {
  state.relatorioState = 'gerando';
  state.relatorioErro = null;
  render();
  try {
    await api('relatorio');
    state.relatorioState = 'ok';
  } catch (e) {
    state.relatorioState = 'erro';
    state.relatorioErro = e.message;
  }
  render();
  if (state.relatorioState === 'ok') {
    setTimeout(() => {
      if (state.relatorioState === 'ok') { state.relatorioState = 'idle'; render(); }
    }, 4000);
  }
}

// Se a pagina for fechada com gravacao pendente, entrega pelo beacon.
window.addEventListener('pagehide', () => {
  Object.keys(pendentes).forEach(chave => {

});

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : str;
  return d.innerHTML;
}

// Escapa o texto normalmente (mesma seguranca de sempre) e so depois
// transforma em link o que parecer uma URL - nunca insere HTML vindo do
// texto em si, so envolve o trecho reconhecido numa tag <a>.
function linkify(str) {
  const escapado = escapeHtml(str);
  return escapado.replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+)/gi, (match) => {
    // Pontuacao de fechamento de frase (. , ; : ! ? ) provavelmente nao faz
    // parte do link - tira do link e devolve depois dele.
    const corte = match.match(/[.,;:!?)\]]+$/);
    const sufixo = corte ? corte[0] : '';
    const url = sufixo ? match.slice(0, -sufixo.length) : match;
    const href = /^https?:\/\//i.test(url) ? url : 'https://' + url;
    return `<a href="${href}" target="_blank" rel="noopener noreferrer" style="color:#9cc4ff; text-decoration:underline; word-break:break-all;">${url}</a>${sufixo}`;
  });
}

function render() {
  const app = document.getElementById('app');
  if (state.loading) {
    app.innerHTML = '<div class="loading">Carregando…</div>';
    return;
  }
  if (state.loadError) {
    app.innerHTML = `
      <div class="crest-wrap">
        <img src="data:image/png;base64,${LOGO_B64}" alt="Insanos MC Brasil">
      </div>
      <div class="alert">
        <div class="alert-title">Não consegui carregar os dados</div>
        <div class="alert-msg">${escapeHtml(state.loadError)}.<br>Verifique sua conexão e tente de novo.</div>
      </div>
      <button class="btn block" data-action="retry-load">Tentar de novo</button>
    `;
    return;
  }
  if (state.view === 'home') return renderHome(app);
  if (state.view === 'event') return renderEvent(app);
  if (state.view === 'confirmados') return renderConfirmados(app);
  if (state.view === 'rank') return renderRank(app);
  if (state.view === 'rank-insights') return renderRankInsights(app);
  if (state.view === 'admin-divisoes') return renderDivisoes(app);
  if (state.view === 'admin-pin') return renderPin(app);
  if (state.view === 'admin') return renderAdmin(app);
  if (state.view === 'relatorio-divisoes') return renderRelatorioDivisoes(app);
  if (state.view === 'relatorio-pin') return renderRelatorioPin(app);
  if (state.view === 'relatorio') return renderRelatorioShell(app);
}

function renderHome(app) {
  if (!state.homeEventosAberto) return renderHomeInicio(app);
  if (!state.homeEscopo) return renderHomeEscolha(app);
  if (!state.homeTipo) return renderHomeTipos(app);
  return renderHomeEventos(app);
}

function formatDataBR(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

const MESES_ABREV = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];

// Formato compacto para o selo do card na tela inicial - "09 SET" em vez de
// "09/09/2026", que não cabe bem num canto de card.
function formatDataCurta(iso) {
  if (!iso) return '';
  const [, m, d] = iso.split('-');
  const mesIndice = Number(m) - 1;
  if (!d || mesIndice < 0 || mesIndice > 11) return '';
  return `${d} ${MESES_ABREV[mesIndice]}`;
}

// Quanto menor o grau (I antes de X), maior o cargo - aparece primeiro.
// Quem nao tem grau cadastrado fica no fim, em ordem alfabetica.
function ordenarPorHierarquia(membros) {
  const indice = (m) => { const i = GRAUS.indexOf(m.grau); return i === -1 ? GRAUS.length : i; };
  return [...membros].sort((a, b) => indice(a) - indice(b) || a.nome.localeCompare(b.nome));
}

// ========================================================================
// PARSER DA CONVOCACAO COLADA (tela "Relatorios")
// Le o texto que o clube ja manda pronto no WhatsApp e transforma em
// { evento, membrosParsed, avisos } - funcao pura, sem tocar em state/DOM,
// pra dar pra testar/ajustar so olhando entrada e saida.
// ========================================================================

const EMOJI_RE = /[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}️]/gu;
function stripEmoji(s) { return s.replace(EMOJI_RE, ''); }

function normalizarNome(s) {
  return String(s || '')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9 ]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// Distancia de edicao simples (Levenshtein) - nomes de membro sao curtos, o
// custo O(n*m) nao pesa.
function distanciaLevenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  const linha = new Array(n + 1);
  for (let j = 0; j <= n; j++) linha[j] = j;
  for (let i = 1; i <= m; i++) {
    let anterior = linha[0];
    linha[0] = i;
    for (let j = 1; j <= n; j++) {
      const temp = linha[j];
      linha[j] = a[i - 1] === b[j - 1]
        ? anterior
        : 1 + Math.min(anterior, linha[j], linha[j - 1]);
      anterior = temp;
    }
  }
  return linha[n];
}

// Sugestoes de "quer dizer" para um nome que nao bateu exato - so serve para
// erro de digitacao/apelido parecido; apelido sem nada em comum com o nome
// cadastrado (ex.: alcunha pura) nao e pego, e precisa de escolha manual.
function sugerirCorrespondencias(nomeParsedNorm, candidatos) {
  return candidatos
    .map(m => ({ membro: m, dist: distanciaLevenshtein(nomeParsedNorm, normalizarNome(m.nome)) }))
    .filter(c => c.dist <= Math.max(2, Math.ceil(nomeParsedNorm.length * 0.4)))
    .sort((a, b) => a.dist - b.dist)
    .slice(0, 3)
    .map(c => c.membro);
}

// Palavra reconhecida manda sobre o emoji quando os dois aparecem e nao
// batem (ex.: "✅ aguardando" na lista real - erro de digitacao humano, a
// palavra e que vale). Quem nao tem emoji nem palavra nenhuma cai em
// "infracional" junto com quem tem ⭕ explicito - decisao do clube: nao
// responder a convocacao e tratado igual a falta sem justificativa.
function statusDoResto(resto) {
  const semEmoji = stripEmoji(resto).trim();
  const palavra = normalizarNome(semEmoji);
  if (palavra.includes('confirmad')) return 'confirmado';
  if (palavra.includes('aguardand')) return 'aguardando';
  if (palavra.includes('trabalho')) return 'trabalho';
  if (palavra.includes('famil')) return 'familia';
  if (palavra.includes('infracional')) return 'infracional';
  if (palavra.includes('justificad')) return 'justificada';

  const temCheck = resto.includes('✅');
  const temX = resto.includes('❌');
  const temCirculo = resto.includes('⭕');
  const temAlerta = resto.includes('⚠️');

  if (!palavra && !temCheck && !temX && !temCirculo && !temAlerta) return 'infracional'; // nao respondeu
  if (temCheck) return 'confirmado';
  if (temCirculo) return 'infracional';
  if (temX) return 'justificada';
  if (temAlerta) return 'aguardando';
  return 'aguardando';
}

function parseConvocacaoTexto(texto) {
  const linhas = String(texto || '').split('\n').map(l => l.trim());
  const avisos = [];
  const evento = { nome: '', tipo: '', data: '', horario: '', endereco: '', outros: '' };

  // --- Titulo do evento: a ultima linha nao-vazia antes de uma linha
  // "Evento" (formato com secoes tipo "🎯 DESTINO 🎯"); sem essa linha
  // (formato mais simples, ex.: "Bate volta divisão Barra" logo na
  // primeira linha), usa a primeira linha nao vazia do texto inteiro.
  const idxEvento = linhas.findIndex(l => l.toLowerCase() === 'evento');
  if (idxEvento > 0) {
    for (let i = idxEvento - 1; i >= 0; i--) {
      if (linhas[i]) { evento.nome = stripEmoji(linhas[i]).trim(); break; }
    }
  } else {
    const primeiraLinha = linhas.find(l => l);
    if (primeiraLinha) evento.nome = stripEmoji(primeiraLinha).trim();
  }
  if (evento.nome) {
    const nomeNorm = normalizarNome(evento.nome);
    // Bate por palavra, nao pela frase inteira - "Bate volta" (sem o "e")
    // ainda precisa reconhecer o tipo "Bate e Volta".
    const tipoAchado = TIPOS_EVENTO.find(t => {
      const tokens = normalizarNome(t).split(' ').filter(tok => tok && tok !== 'e' && tok !== 'de');
      return tokens.every(tok => nomeNorm.includes(tok));
    });
    if (tipoAchado) evento.tipo = tipoAchado;
  }

  // --- Data: token tipo "09SET26" (dia+mes abreviado+ano) em qualquer
  // linha, ou "19/07/2026"/"19/07/26" (numerica, com barra) - tenta o
  // primeiro formato antes, ja que "SET" nunca bate com o padrao numerico.
  const matchData = texto.match(/(\d{1,2})\s*([A-ZÇ]{3})\s*(\d{2})\b/i);
  if (matchData) {
    const dia = matchData[1].padStart(2, '0');
    const mesIdx = MESES_ABREV.indexOf(matchData[2].toUpperCase());
    if (mesIdx !== -1) {
      const ano = 2000 + Number(matchData[3]);
      evento.data = `${ano}-${String(mesIdx + 1).padStart(2, '0')}-${dia}`;
    } else {
      avisos.push('Não reconheci o mês na data — confira o campo Data.');
    }
  } else {
    const matchDataNumerica = texto.match(/(\d{1,2})\s*\/\s*(\d{1,2})\s*\/\s*(\d{2,4})/);
    if (matchDataNumerica) {
      const dia = matchDataNumerica[1].padStart(2, '0');
      const mes = Number(matchDataNumerica[2]);
      const anoBruto = matchDataNumerica[3];
      const ano = anoBruto.length === 2 ? String(2000 + Number(anoBruto)) : anoBruto;
      if (mes >= 1 && mes <= 12) {
        evento.data = `${ano}-${String(mes).padStart(2, '0')}-${dia}`;
      } else {
        avisos.push('Não reconheci a data (mês inválido) — confira o campo Data.');
      }
    }
  }

  // --- Endereco: "Destino: X" numa linha so, ou (formato com secoes) entre
  // a linha "🎯 DESTINO 🎯" e a proxima secao ---
  const idxDestino = linhas.findIndex(l => /destino/i.test(l));
  if (idxDestino !== -1) {
    const matchDestinoInline = linhas[idxDestino].match(/destino\s*:\s*(.+)/i);
    if (matchDestinoInline && matchDestinoInline[1].trim()) {
      evento.endereco = stripEmoji(matchDestinoInline[1]).trim();
    } else {
      const enderecoLinhas = [];
      for (let i = idxDestino + 1; i < linhas.length; i++) {
        const l = linhas[i];
        if (!l) continue;
        if (/^\.{4,}$/.test(l) || /horários/i.test(l) || /⏰/.test(l) || /^resposta\s*:?\s*$/i.test(l)) break;
        if (/^https?:\/\//i.test(l)) { evento.outros = evento.outros ? evento.outros + '\n' + l : l; continue; }
        enderecoLinhas.push(l);
      }
      evento.endereco = enderecoLinhas.join(', ');
    }
  }

  // --- Horarios: Destacamento / Briefing / Inicio ---
  const normalizaHora = (h) => {
    const m = h.match(/(\d{1,2})h(\d{0,2})/i);
    if (!m) return h;
    return `${m[1].padStart(2, '0')}:${(m[2] || '00').padStart(2, '0')}`;
  };
  const extrasHorario = [];
  linhas.forEach(l => {
    const mIni = l.match(/in[íi]cio[:\s]*([0-9]{1,2}h[0-9]{0,2})/i);
    if (mIni) { evento.horario = normalizaHora(mIni[1]); return; }
    const mDest = l.match(/destacamento[:\s]*([0-9]{1,2}h[0-9]{0,2})/i);
    if (mDest) { extrasHorario.push('Destacamento: ' + normalizaHora(mDest[1])); return; }
    const mBrief = l.match(/briefing[:\s]*([0-9]{1,2}h[0-9]{0,2})/i);
    if (mBrief) { extrasHorario.push('Briefing: ' + normalizaHora(mBrief[1])); return; }
  });
  if (extrasHorario.length) {
    evento.outros = evento.outros ? evento.outros + '\n' + extrasHorario.join(' · ') : extrasHorario.join(' · ');
  }

  // --- Lista de membros ---
  // Duas convencoes vistas na pratica: um cabecalho "👥 MEMBROS 👥" (com
  // numeracao "01. Nome (Grau) status") ou simplesmente uma linha "Lista:"
  // seguida dos nomes sem numero (ex.: "Costa(VI)✅").
  const idxMembros = linhas.findIndex(l => /membros/i.test(l) || /^lista\s*:?\s*$/i.test(l));
  const membrosParsed = [];
  if (idxMembros !== -1) {
    let divisaoAtual = '';
    // Nome tolera qualquer caixa (maiuscula/minuscula/acentuada) - a
    // convocacao real vem toda em CAIXA ALTA, mas um nome digitado errado
    // (ou colado de outro lugar) nao pode sumir da lista silenciosamente.
    // O numero antes do nome e opcional (algumas listas nao numeram); o
    // grau aceita qualquer texto entre parenteses, nao so numeral romano -
    // um grau fora do padrao (ex.: "camisa") ainda entra na lista, so com
    // aviso pra conferir na revisao, em vez de sumir sem explicacao.
    const memberRe = /^(?:(\d{1,3})\.\s*)?([A-Za-zÀ-ÖØ-öø-ÿ0-9][A-Za-zÀ-ÖØ-öø-ÿ0-9 .'\-]*?)\s*\(([^)]+)\)\s*(.*)$/;
    for (let i = idxMembros + 1; i < linhas.length; i++) {
      const l = linhas[i];
      if (/^participa[çc][ãa]o/i.test(l)) break; // legenda - fim da lista
      if (/^divis[ãa]o\s+/i.test(l)) { divisaoAtual = l.replace(/^divis[ãa]o\s+/i, 'Divisão ').trim(); continue; }
      const m = l.match(memberRe);
      if (!m) continue;
      const [, numeroBruto, nomeTexto, grauBruto, resto] = m;
      const numero = numeroBruto || String(membrosParsed.length + 1).padStart(2, '0');
      const grau = grauBruto.trim().toUpperCase();
      if (GRAUS.indexOf(grau) === -1) avisos.push(`Grau "${grauBruto.trim()}" (${nomeTexto.trim()}) não reconhecido — confira antes de confirmar.`);
      membrosParsed.push({
        numero,
        nomeTexto: nomeTexto.trim(),
        grauTexto: grau,
        divisaoTexto: divisaoAtual,
        status: statusDoResto(resto),
        direto: resto.includes('🚀'),
        destacado: resto.includes('🚧'),
        acompanhado: resto.includes('🐯'),
        membroId: null,
        ignorado: false,
        sugestoes: []
      });
    }
  } else {
    avisos.push('Não encontrei a lista de membros (procure por uma seção "MEMBROS" ou "Lista:") no texto colado.');
  }

  return { evento, membrosParsed, avisos };
}

// Casa cada membro lido do texto com o cadastro (state.roster), por nome
// normalizado; quem nao bate exato recebe sugestoes por semelhanca. Nao
// muda nada em state.roster - so preenche membroId/sugestoes de cada linha.
function resolverParsedComRoster(membrosParsed, escopoChave) {
  const candidatosBase = escopoChave === 'regional'
    ? state.roster
    : state.roster.filter(m => m.divisao === escopoPorChave(escopoChave).nome);

  return membrosParsed.map(row => {
    const candidatos = escopoChave === 'regional' && row.divisaoTexto
      ? state.roster.filter(m => normalizarNome(m.divisao).includes(normalizarNome(row.divisaoTexto).replace('divisao ', '')))
      : candidatosBase;
    const pool = candidatos.length ? candidatos : candidatosBase;
    const alvoNorm = normalizarNome(row.nomeTexto);
    const exato = pool.find(m => normalizarNome(m.nome) === alvoNorm);
    if (exato) return { ...row, membroId: exato.id };
    return { ...row, membroId: null, sugestoes: sugerirCorrespondencias(alvoNorm, pool) };
  });
}

// So usado em eventos regionais: agrupa os participantes pela divisao de
// cada um (ordem alfabetica do nome da divisao), com a hierarquia aplicada
// dentro de cada grupo. Funciona desde ja porque cada membro ja carrega a
// propria divisao - so vai mostrar mais de um grupo quando existir membro
// de outra divisao alem da Barra.
function agruparPorDivisao(membros) {
  const porDivisao = {};
  membros.forEach(m => {
    const chave = m.divisao || 'Sem divisão';
    (porDivisao[chave] = porDivisao[chave] || []).push(m);
  });
  // Regional no topo, depois alfabetica - mesma regra de
  // escoposEmOrdemDeExibicao(), so que aqui os nomes vem direto dos membros
  // (string), nao da lista ESCOPOS.
  const nomeRegional = escopoPorChave('regional').nome;
  const ordenadas = Object.keys(porDivisao).sort((a, b) => {
    if (a === nomeRegional) return -1;
    if (b === nomeRegional) return 1;
    return a.localeCompare(b);
  });
  return ordenadas.map(divisao => ({
    divisao,
    membros: ordenarPorHierarquia(porDivisao[divisao])
  }));
}

// Contagem ao vivo de um grupo, lida do status atual do evento aberto
// (state.currentStatus) - atualiza sozinha a cada confirmacao, igual o
// resto da tela.
function contagemGrupo(membros) {
  const c = { confirmado: 0, aguardando: 0, faltam: 0 };
  membros.forEach(m => {
    const st = getMemberStatus(m.id).status;
    if (st === 'confirmado') c.confirmado++;
    else if (st === 'familia' || st === 'trabalho' || st === 'infracional' || st === 'justificada') c.faltam++;
    else c.aguardando++;
  });
  return c;
}

// Clicavel: abre/fecha a lista de nomes daquela divisao. A contagem e a %
// aparecem sempre, mesmo fechado - só os nomes ficam escondidos ate abrir.
function renderSubtituloDivisao(nome, membros, aberto) {
  const c = contagemGrupo(membros);
  const pct = membros.length ? Math.round((c.confirmado / membros.length) * 100) : 0;
  return `
    <div class="division-subheader clicavel" data-action="toggle-divisao-grupo" data-value="${escapeHtml(nome)}">
      <span>${aberto ? '▾' : '▸'} ${escapeHtml(nome.toUpperCase())}</span>
      <span class="division-counts">
        ✅ ${c.confirmado} &nbsp; ⚠️ ${c.aguardando} &nbsp; ❌ ${c.faltam} &nbsp;·&nbsp; <b>${pct}%</b>
      </span>
    </div>
  `;
}

// Eventos de divisao: lista unica, ordenada por hierarquia. Eventos
// regionais: agrupados por divisao (cada grupo com o proprio subtitulo,
// contagem ao vivo e numeracao reiniciando do 01) - os nomes so aparecem na
// divisao que a pessoa abrir, pra nao rolar por todo mundo ate achar o
// proprio nome.
function renderListaMembros(ev, members) {
  if (ev.categoria === 'regional') {
    return agruparPorDivisao(members).map(grupo => {
      const aberto = state.expandedDivisoes.has(grupo.divisao);
      return `
        ${renderSubtituloDivisao(grupo.divisao, grupo.membros, aberto)}
        ${aberto ? grupo.membros.map((m, i) => renderMemberRow(m, i)).join('') : ''}
      `;
    }).join('');
  }
  return ordenarPorHierarquia(members).map((m, i) => renderMemberRow(m, i)).join('');
}

// Enquanto a leitura nao confirma, a lista aparece esmaecida e nao aceita
// toque: o que esta na tela ainda nao e o dado real da planilha.
function renderStatusBanner() {
  if (state.statusError) {
    return `
      <div class="alert">
        <div class="alert-title">Não consegui carregar as confirmações</div>
        <div class="alert-msg">${escapeHtml(state.statusError)}.<br>A lista abaixo não é a de verdade, por isso está bloqueada.</div>
        <button class="btn secondary block" data-action="retry-status" style="margin-top:10px;">Tentar de novo</button>
      </div>
    `;
  }
  if (!state.statusLoaded) {
    return '<div class="alert info"><div class="alert-msg">Carregando as confirmações…</div></div>';
  }
  if (state.saveState === 'saving') {
    return '<div class="alert info"><div class="alert-msg">Salvando… pode continuar marcando.</div></div>';
  }
  if (state.saveState === 'saved') {
    return '<div class="alert ok"><div class="alert-msg">✅ Salvo na planilha</div></div>';
  }
  if (state.saveState === 'error') {
    return `
      <div class="alert">
        <div class="alert-title">Ainda não salvou</div>
        <div class="alert-msg">Suas marcações estão na tela, mas não chegaram na planilha.<br>Não feche antes de salvar.</div>
        <button class="btn secondary block" data-action="retry-save" style="margin-top:10px;">Tentar salvar de novo</button>
      </div>
    `;
  }
  return '';
}

// O PIN nunca e comparado no navegador - so o servidor sabe o valor certo.
// A pagina manda o que foi digitado e recebe de volta so um sim/nao.
async function checkPin() {
  if (state.pinVerificando) return;
  const val = document.getElementById('pin-field').value.trim();
  if (!val) return;
  state.pinVerificando = true;
  state.pinErro = null;
  render();
  try {
    const r = await api('verificarPin', { escopo: state.adminEscopo, pin: val });
    if (r.valido) {
      state.isAdmin = true;
      state.view = 'admin';
      state.adminTab = 'eventos';
    } else {
      state.pinErro = 'PIN incorreto.';
    }
  } catch (e) {
    state.pinErro = 'Não consegui verificar (' + e.message + '). Tente de novo.';
  }
  state.pinVerificando = false;
  render();
}
