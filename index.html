      </div>
    </div>
  `;
}

function renderRelatorioShell(app) {
  const conteudo = state.relatorioTab === 'eventos' ? conteudoRelatorioEventos()
    : state.relatorioTab === 'resumo' ? conteudoRelatorioPresenca()
    : state.relatorioTab === 'enviar' ? conteudoRelatorioColar()
    : TIPOS_EVENTO_TABS_ORDEM.includes(state.relatorioTab) ? conteudoRelatorioTipoFixo(state.relatorioTab)
    : conteudoRelatorioColar();

  app.innerHTML = `
    <div class="back-link on-photo" data-action="go-relatorio-divisoes">‹ Trocar divisão</div>
    <div class="crest-wrap" style="margin-bottom: 8px;">
      <h1 style="font-size: 19px;">Relatórios</h1>
      <div class="sub">${escapeHtml(escopoPorChave(state.relatorioEscopo).nome)}</div>
    </div>
    <div class="tabs tabs-wrap">
      ${RELATORIO_TABS.map(t => `<div class="tab ${state.relatorioTab === t.chave ? 'active' : ''}" data-action="relatorio-tab" data-tab="${t.chave}">${t.label}</div>`).join('')}
    </div>
    ${renderRelatorioFiltroDivisao()}
    ${conteudo}
  `;
}

function conteudoRelatorioColar() {
  if (state.relatorioColarStep === 'revisao') return conteudoRelatorioRevisao();
  if (state.relatorioColarStep === 'resultado') return conteudoRelatorioResultado();
  // So faz sentido escolher a divisao do relatorio quando o acesso foi pelo
  // PIN Regional - ele e chave-mestra, entao da pra colar tanto a
  // convocacao regional inteira (varias divisoes juntas) quanto a
  // convocacao de uma divisao especifica sem precisar do PIN dela. Fora do
  // Regional so existe uma opcao (a propria divisao), entao nao mostra nada.
  const seletorDivisao = state.relatorioEscopo === 'regional' ? `
    <div class="card" style="margin-bottom:14px;">
      <div style="font-weight:600; margin-bottom:8px;">Essa convocação é de qual divisão?</div>
      <div class="chip-grid wide">
        ${escoposEmOrdemDeExibicao().map(e => `
          <button class="chip-option ${state.relatorioCategoriaAlvo === e.chave ? 'active' : ''}" data-action="set-relatorio-categoria" data-value="${e.chave}">${escapeHtml(e.nome)}</button>
        `).join('')}
      </div>
    </div>
  ` : '';
  return `
    ${seletorDivisao}
    <div class="card" style="margin-bottom:14px;">
      <div style="font-weight:600; margin-bottom:8px;">Tipo de evento</div>
      <div class="chip-grid wide">
        ${TIPOS_EVENTO.map(t => `
          <button class="chip-option ${state.relatorioTipoEscolhido === t ? 'active' : ''}" data-action="set-relatorio-tipo" data-value="${escapeHtml(t)}">${emojiTipoEvento(t)} ${escapeHtml(t.toUpperCase())}</button>
        `).join('')}
      </div>
    </div>
    <div class="card">
      <div class="field">
        <label>Cole aqui a convocação inteira (a mesma que vai pro WhatsApp)</label>
        <textarea id="relatorio-texto-field" rows="14" placeholder="Cole o texto da convocação, com a lista de membros e os status de cada um…">${escapeHtml(state.relatorioTextoBruto)}</textarea>
      </div>
      <button class="btn block" data-action="analisar-convocacao">Analisar</button>
    </div>
  `;
}

function analisarConvocacao() {
  // Le direto do campo (nao so de state.relatorioTextoBruto) - o campo nao
  // dispara um re-render a cada letra digitada, entao o valor no state pode
  // ficar defasado se o navegador preencher o campo sem passar pelo evento
  // "input" (autofill, colar via menu de contexto em alguns navegadores).
  const campo = document.getElementById('relatorio-texto-field');
  if (campo) state.relatorioTextoBruto = campo.value;
  if (!state.relatorioTextoBruto.trim()) return;

  const parsed = parseConvocacaoTexto(state.relatorioTextoBruto);
  // O tipo escolhido nos botoes acima da caixa de texto vence o palpite do
  // parser (que so tenta adivinhar pelo titulo do texto colado) - mais
  // confiavel que depender do texto ter uma palavra reconhecivel.
  if (state.relatorioTipoEscolhido) parsed.evento.tipo = state.relatorioTipoEscolhido;
  // Casa os nomes contra a divisao escolhida (relatorioCategoriaAlvo), nao
  // contra o escopo de acesso (relatorioEscopo) - um organizador Regional
  // colando so a convocacao da Curicica precisa que os nomes batam com o
  // elenco da Curicica, nao com a planilha toda.
  parsed.membrosParsed = resolverParsedComRoster(parsed.membrosParsed, state.relatorioCategoriaAlvo || state.relatorioEscopo);
  // Foto do momento em que o parser terminou de rodar, antes de qualquer
  // correção manual - é o que mede "quão bem o parser se saiu", diferente
  // de naoResolvidos (que muda a cada correção feita na tela de revisão).
  parsed.autoResolvidos = parsed.membrosParsed.filter(r => r.membroId).length;
  state.relatorioParsed = parsed;
  state.relatorioColarStep = 'revisao';
  state.relatorioDuplicidadeAviso = null;
  state.relatorioDuplicidadeConfirmada = false;
  render();
}

// Mesma divisao (categoria) e mesma data ja tem outro evento gravado - sinal
// forte de convocacao colada duas vezes por engano (ou duplo clique em
// "Confirmar"). Nao bloqueia - so avisa, porque duas divisoes podem ter
// eventos legitimos no mesmo dia, ou o clube pode ter dois eventos no mesmo
// dia de fato.
function eventosPossivelmenteDuplicados(data, categoria) {
  return state.events.filter(e => e.data === data && e.categoria === categoria);
}

const STATUS_TOTAIS_LABEL = {
  confirmado: 'confirmados', aguardando: 'aguardando', trabalho: 'faltas (trabalho)',
  familia: 'faltas (família)', justificada: 'faltas justificadas', infracional: 'faltas infracionais'
};

function conteudoRelatorioRevisao() {
  const parsed = state.relatorioParsed;
  if (!parsed) { state.relatorioColarStep = 'texto'; return conteudoRelatorioColar(); }
  const ev = parsed.evento;
  const membros = parsed.membrosParsed;
  const naoResolvidos = membros.filter(r => !r.membroId && !r.ignorado);
  const totais = {};
  membros.forEach(r => { if (!r.ignorado) totais[r.status] = (totais[r.status] || 0) + 1; });
  // Tipo entra aqui porque e escolhido por chip (re-renderiza na hora); Data
  // e Nome sao campos de texto/data que nao disparam render a cada letra -
  // por isso ficam de fora do calculo do botao e sao validados so no clique
  // de "Confirmar" (ver confirmarEventoParseado), senao o botao trava
  // "desabilitado" sem nunca destravar (mesmo bug que ja corrigimos no
  // "Analisar").
  const podeConfirmar = naoResolvidos.length === 0 && membros.some(r => r.membroId) && !!ev.tipo;

  const categoriaAlvo = state.relatorioCategoriaAlvo || state.relatorioEscopo;
  const escopoNome = escopoPorChave(categoriaAlvo).nome;
  const candidatosDropdown = categoriaAlvo === 'regional'
    ? state.roster
    : state.roster.filter(m => m.divisao === escopoNome);

  return `
    <div class="btn ghost" style="margin-bottom:10px;" data-action="go-relatorio-texto">‹ Colar de novo</div>
    <div style="font-weight:600; font-size:15px; margin-bottom:2px;">Revisar antes de salvar</div>
    <div style="color:var(--text-muted); font-size:12.5px; margin-bottom:10px;">Divisão: ${escapeHtml(escopoNome)}</div>

    ${parsed.avisos.length ? `
      <div class="alert info" style="margin-bottom:14px;">
        ${parsed.avisos.map(a => `<div class="alert-msg">⚠️ ${escapeHtml(a)}</div>`).join('')}
      </div>
    ` : ''}

    <div class="card">
      <div class="field">
        <label>Nome do evento</label>
        <input type="text" id="rev-evento-nome" value="${escapeHtml(ev.nome)}">
      </div>
      <label>Tipo de evento</label>
      <div class="chip-grid wide" style="margin-bottom: 14px;">
        ${TIPOS_EVENTO.map(t => `
          <button class="chip-option ${ev.tipo === t ? 'active' : ''}" data-action="set-revisao-tipo" data-value="${escapeHtml(t)}">${emojiTipoEvento(t)} ${escapeHtml(t)}</button>
        `).join('')}
      </div>
      ${!ev.tipo ? '<div style="color:#C9A29C; font-size:12.5px; margin:-8px 0 14px;">Obrigatório — escolha o tipo antes de confirmar.</div>' : ''}
      <div class="row-gap" style="margin-bottom: 0;">
        <div class="field" style="flex: 1; min-width: 130px;">
          <label>Data</label>
          <input type="date" id="rev-evento-data" value="${escapeHtml(ev.data)}">
          <div class="date-hint">D · M · A</div>
        </div>
        <div class="field" style="flex: 1; min-width: 100px;">
          <label>Horário</label>
          <input type="time" id="rev-evento-horario" value="${escapeHtml(ev.horario)}">
        </div>
      </div>
      ${!ev.data ? '<div style="color:#C9A29C; font-size:12.5px; margin:-8px 0 14px;">Sem data no texto colado — preencha antes de confirmar.</div>' : ''}
      <div class="field">
        <label>Endereço</label>
        <input type="text" id="rev-evento-endereco" value="${escapeHtml(ev.endereco)}">
      </div>
      <div class="field">
        <label>Outros (opcional)</label>
        <textarea id="rev-evento-outros" rows="2">${escapeHtml(ev.outros)}</textarea>
      </div>
    </div>

    <div class="card" style="margin-top:14px;">
      <div style="font-weight:600; margin-bottom:4px;">Membros lidos da lista (${membros.length})</div>
      <div style="font-size:12.5px; margin-bottom:10px; color:${parsed.autoResolvidos === membros.length ? 'var(--status-confirmado)' : 'var(--text-muted)'};">
        ${parsed.autoResolvidos === membros.length ? '✅' : '⚠️'} ${parsed.autoResolvidos} de ${membros.length} nomes reconhecidos automaticamente${parsed.autoResolvidos < membros.length ? ' — confira os demais abaixo' : ''}
      </div>
      <div class="revisao-list">
        ${membros.map((r, i) => renderLinhaRevisao(r, i, candidatosDropdown)).join('')}
      </div>
    </div>

    ${naoResolvidos.length ? `
      <div class="alert" style="margin-top:14px;">
        <div class="alert-title">${naoResolvidos.length} nome(s) sem correspondência</div>
        <div class="alert-msg">Escolha o membro certo (ou "Ignorar") na lista acima antes de confirmar.</div>
      </div>
    ` : ''}

    <div class="card" style="margin-top:14px;">
      <div style="font-weight:600; margin-bottom:6px;">Resumo</div>
      ${Object.keys(STATUS_TOTAIS_LABEL).map(k => `<div class="info-line">${totais[k] || 0} ${STATUS_TOTAIS_LABEL[k]}</div>`).join('')}
    </div>

    ${state.relatorioSalvarErro ? `
      <div class="alert" style="margin-top:14px;">
        <div class="alert-title">Não consegui salvar</div>
        <div class="alert-msg">${escapeHtml(state.relatorioSalvarErro)}</div>
      </div>
    ` : ''}

    ${state.relatorioDuplicidadeAviso && state.relatorioDuplicidadeAviso.length ? `
      <div class="alert" style="margin-top:14px;">
        <div class="alert-title">${state.relatorioDuplicidadeAviso.length === 1 ? 'Já existe um evento nessa data' : 'Já existem eventos nessa data'}</div>
        <div class="alert-msg">
          Em ${formatDataBR(ev.data)}, nessa divisão: ${state.relatorioDuplicidadeAviso.map(d => escapeHtml(d.nome)).join(', ')}. Confira se não é o mesmo evento antes de criar outro.
        </div>
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button class="btn ghost" style="flex:1;" data-action="cancelar-duplicidade-relatorio">Cancelar</button>
          <button class="btn block" style="flex:1;" data-action="confirmar-duplicidade-relatorio" ${state.relatorioSalvando ? 'disabled' : ''}>${state.relatorioSalvando ? 'Salvando…' : 'Criar mesmo assim'}</button>
        </div>
      </div>
    ` : `
      <button class="btn block" style="margin-top:14px;" data-action="confirmar-evento-parseado" ${podeConfirmar && !state.relatorioSalvando ? '' : 'disabled'}>
        ${state.relatorioSalvando ? 'Salvando…' : 'Confirmar e criar evento'}
      </button>
    `}
  `;
}

function renderLinhaRevisao(r, i, candidatos) {
  const s = STATUS[r.status];
  return `
    <div class="revisao-row${r.ignorado ? ' ignorado' : ''}">
      <div class="revisao-row-top">
        <div class="revisao-nome">${escapeHtml(r.nomeTexto)} <span style="color:var(--text-muted);">(${escapeHtml(r.grauTexto)})</span></div>
        <div class="revisao-status">${s.emoji} ${s.label}</div>
      </div>
      <div class="revisao-row-bottom">
        ${r.ignorado ? '<span style="color:var(--text-muted); font-size:13px;">Ignorado</span>' : `
          <select data-action="resolver-membro" data-index="${i}">
            <option value="">— selecionar —</option>
            ${candidatos.map(m => `<option value="${m.id}" ${r.membroId === m.id ? 'selected' : ''}>${escapeHtml(m.nome)}${m.grau ? ' (' + escapeHtml(m.grau) + ')' : ''}</option>`).join('')}
          </select>
        `}
        <span class="btn ghost" style="padding:2px 8px; font-size:12px;" data-action="${r.ignorado ? 'reincluir-membro-parseado' : 'ignorar-membro-parseado'}" data-index="${i}">
          ${r.ignorado ? 'Reincluir' : 'Ignorar'}
        </span>
      </div>
      ${!r.ignorado && !r.membroId && r.sugestoes.length ? `
        <div class="revisao-sugestoes">
          ${r.sugestoes.map(m => `<span class="chip-option" data-action="aceitar-sugestao" data-index="${i}" data-id="${m.id}">Quis dizer ${escapeHtml(m.nome)}?</span>`).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

async function confirmarEventoParseado() {
  if (state.relatorioSalvando) return;
  const parsed = state.relatorioParsed;
  const ev = {
    nome: document.getElementById('rev-evento-nome').value.trim(),
    data: document.getElementById('rev-evento-data').value,
    horario: document.getElementById('rev-evento-horario').value,
    endereco: document.getElementById('rev-evento-endereco').value.trim(),
    outros: document.getElementById('rev-evento-outros').value.trim()
  };
  // Grava direto em parsed.evento antes de qualquer validacao - se render()
  // for chamado de novo daqui pra frente (campo faltando, duplicidade
  // encontrada), os inputs sao reconstruidos a partir de parsed.evento, e
  // sem isso a edicao que a pessoa acabou de fazer no campo se perderia.
  Object.assign(parsed.evento, ev);
  if (!ev.nome) { state.relatorioSalvarErro = 'Preencha o nome do evento.'; return render(); }
  // Data/tipo/integrantes sao os 3 pontos que o evento sempre precisa
  // gravar - o texto colado pode nao trazer a data (como nesse exemplo sem
  // nenhuma data), entao o app exige preencher na mao em vez de salvar em
  // branco.
  if (!ev.data) { state.relatorioSalvarErro = 'Preencha a data do evento.'; return render(); }
  if (!parsed.evento.tipo) { state.relatorioSalvarErro = 'Escolha o tipo de evento.'; return render(); }

  const categoria = state.relatorioCategoriaAlvo || state.relatorioEscopo;
  if (!state.relatorioDuplicidadeConfirmada) {
    const duplicatas = eventosPossivelmenteDuplicados(ev.data, categoria);
    if (duplicatas.length) { state.relatorioDuplicidadeAviso = duplicatas; return render(); }
  }
  state.relatorioDuplicidadeAviso = null;

  const membros = parsed.membrosParsed
    .filter(r => !r.ignorado && r.membroId)
    .map(r => ({ id: r.membroId, status: r.status, direto: r.direto, destacado: r.destacado, acompanhado: r.acompanhado }));

  state.relatorioSalvando = true;
  state.relatorioSalvarErro = null;
  render();
  try {
    const r = await apiPost('criarEventoDeTexto', {
      nome: ev.nome, data: ev.data, horario: ev.horario, endereco: ev.endereco, outros: ev.outros,
      // A categoria do evento e a divisao escolhida na tela de colar
      // (relatorioCategoriaAlvo), nao o escopo de acesso (relatorioEscopo) -
      // um organizador Regional pode estar colando a convocacao so da
      // Curicica, e o evento tem que nascer como categoria "curicica".
      categoria: categoria, tipo: parsed.evento.tipo || '',
      // A lista colada ja e o resultado final (quem foi, quem faltou) - o
      // evento nasce encerrado, sem precisar que o organizador va la depois
      // so pra clicar em "Encerrar". Isso tambem faz a % de presenca do
      // membro contar esse evento na hora (so eventos encerrados entram na
      // conta, ver lerEstatisticasMembros no Code.gs).
      status: 'encerrado',
      membros: membros
    });
    state.relatorioSalvoEventoId = r.id;
    await loadInitial();
    state.relatorioColarStep = 'resultado';
  } catch (e) {
    state.relatorioSalvarErro = e.message;
  }
  state.relatorioSalvando = false;
  render();
}

function conteudoRelatorioResultado() {
  const ev = state.events.find(e => e.id === state.relatorioSalvoEventoId);
  if (!ev) {
    return `
      <div class="card"><div class="empty">Não encontrei o evento recém-criado na lista — confira na aba Eventos.</div></div>
      <button class="btn block" data-action="go-home">Ir para a tela inicial</button>
    `;
  }
  const statusPorMembro = {};
  (state.relatorioParsed ? state.relatorioParsed.membrosParsed : []).forEach(r => {
    if (r.membroId) statusPorMembro[r.membroId] = r.status;
  });
  const groups = { confirmado: [], familia: [], trabalho: [], aguardando: [], justificada: [], infracional: [] };
  ev.memberIds.forEach(mid => {
    const m = state.roster.find(r => r.id === mid);
    if (!m) return;
    const st = statusPorMembro[mid] || 'aguardando';
    (groups[st] || groups.aguardando).push(m.nome);
  });
  const total = ev.memberIds.length;
  const pct = total ? Math.round((groups.confirmado.length / total) * 100) : 0;

  return `
    <div style="font-weight:600; font-size:15px; margin-bottom:10px;">✅ Evento criado: ${escapeHtml(ev.nome)}</div>
    <div class="card">
      <div class="info-line"><b>${pct}% de presença</b> (${groups.confirmado.length} de ${total})</div>
      <div class="info-line">✅ Confirmados: ${groups.confirmado.length}</div>
      <div class="info-line">⚠️ Aguardando: ${groups.aguardando.length}</div>
      <div class="info-line">❌ Faltas justificadas: ${groups.familia.length + groups.trabalho.length + groups.justificada.length}</div>
      <div class="info-line">⭕ Faltas infracionais (inclui quem não respondeu): ${groups.infracional.length}</div>
      ${groups.infracional.length ? `<div class="info-line" style="white-space:pre-wrap; color:var(--text-muted);">${groups.infracional.map(n => '- ' + n).join('\n')}</div>` : ''}
    </div>
    <div class="row-gap" style="margin-top:14px;">
      <button class="btn" data-action="open-event" data-id="${ev.id}">Ver evento</button>
      <button class="btn secondary" data-action="nova-convocacao">Colar outra convocação</button>
    </div>
  `;
}

// Todos os eventos da divisao/Regional escolhida na tela de Relatorios -
// tanto os criados colando convocacao quanto os que ja existiam antes
// (criados pelo Modo organizador), ja que sao o mesmo tipo de registro. No
// Regional (unica chave-mestra), respeita o filtro de divisao escolhido no
// topo do painel: 'todas' junta tudo (inclusive convocacoes coladas em nome
// de uma divisao especifica, que "sumiam" do resumo Regional antes disso
// existir), uma chave especifica mostra so os eventos daquela categoria -
// 'regional' inclusive, pros eventos que sao da Regional mesmo.
function eventosDoRelatorioEscopo() {
  return state.events
    .filter(e => {
      if (state.relatorioEscopo !== 'regional') return e.categoria === state.relatorioEscopo;
      return state.relatorioFiltroDivisao === 'todas' || e.categoria === state.relatorioFiltroDivisao;
    })
    .sort((a, b) => (b.data || '').localeCompare(a.data || '') || (b.criadoEm || '').localeCompare(a.criadoEm || ''));
}

// Roster visivel no painel de Relatorios, respeitando o mesmo filtro de
// divisao de eventosDoRelatorioEscopo() - usado pelas abas fixas de tipo
// ("% de cada integrante em X"), onde faz sentido restringir a lista de
// nomes tambem, nao so os eventos.
function membrosVisiveisRelatorio() {
  if (state.relatorioEscopo !== 'regional') {
    const nomeEscopo = escopoPorChave(state.relatorioEscopo).nome;
    return state.roster.filter(m => m.divisao === nomeEscopo);
  }
  if (state.relatorioFiltroDivisao === 'todas') return state.roster;
  const nomeFiltro = escopoPorChave(state.relatorioFiltroDivisao).nome;
  return state.roster.filter(m => m.divisao === nomeFiltro);
}

function renderCardEvento(ev) {
  const pct = ev.status === 'encerrado' && state.reportData[ev.id]
    ? (() => { const c = computeCounts(ev); const total = ev.memberIds.length;
                return total ? Math.round((c.confirmado / total) * 100) : 0; })()
    : null;
  return `
    <div class="card event-card" data-action="open-event" data-id="${ev.id}">
      <div>
        <div class="name">${escapeHtml(ev.nome)}</div>
        <div class="meta">${ev.data ? formatDataBR(ev.data) + ' · ' : ''}${ev.status === 'encerrado' ? 'Encerrado' : 'Ativo'}${pct !== null ? ' · ' + pct + '% presença' : ''}</div>
      </div>
      <div class="arrow">›</div>
    </div>
  `;
}

// Lista de eventos agrupada por divisao - so faz sentido no Regional com
// "Todas as divisões", onde os eventos vem de categorias diferentes e senao
// nao da pra saber de qual divisao e cada um so olhando o nome. Mesmo
// padrao visual/comportamento (cabecalho recolhivel, comeca fechado) de
// renderListaEstatisticasPorDivisao.
function renderEventosAgrupados(eventos) {
  const porDivisao = {};
  eventos.forEach(ev => {
    const nomeDivisao = escopoPorChave(ev.categoria).nome;
    (porDivisao[nomeDivisao] = porDivisao[nomeDivisao] || []).push(ev);
  });
  const nomeRegional = escopoPorChave('regional').nome;
  const ordenadas = Object.keys(porDivisao).sort((a, b) => {
    if (a === nomeRegional) return -1;
    if (b === nomeRegional) return 1;
    return a.localeCompare(b);
  });
  return `
    <div class="card" style="padding: 4px 16px;">
      ${ordenadas.map(divisao => {
        const itens = porDivisao[divisao];
        const aberto = state.relatorioEventosExpandidos.has(divisao);
        return `
          <div class="division-subheader clicavel" data-action="toggle-relatorio-eventos-divisao" data-value="${escapeHtml(divisao)}">
            <span>${aberto ? '▾' : '▸'} ${escapeHtml(divisao.toUpperCase())}</span>
            <span class="division-counts">${itens.length} ${itens.length === 1 ? 'evento' : 'eventos'}</span>
          </div>
          ${aberto ? itens.map(renderCardEvento).join('') : ''}
        `;
      }).join('')}
    </div>
  `;
}

function conteudoRelatorioEventos() {
  const eventos = eventosDoRelatorioEscopo();
  if (!eventos.length) return '<div class="empty">Nenhum evento ainda nessa divisão.</div>';
  const agrupar = state.relatorioEscopo === 'regional' && state.relatorioFiltroDivisao === 'todas';
  return `
    ${state.reportError ? `
      <div class="alert" style="margin-bottom:14px;">
        <div class="alert-title">Não consegui carregar a % de alguns eventos</div>
        <div class="alert-msg">${escapeHtml(state.reportError)}.</div>
        <button class="btn secondary block" data-action="retry-relatorio-eventos" style="margin-top:10px;">Tentar de novo</button>
      </div>
    ` : ''}
    ${agrupar ? renderEventosAgrupados(eventos) : `
      <div class="card" style="padding: 4px 16px;">
        ${eventos.map(renderCardEvento).join('')}
      </div>
    `}
  `;
}

// Aba "Presenca": % por evento, % total do periodo e % de cada integrante -
// os dois primeiros calculados no navegador a partir do mesmo cache
// (state.reportData) que a aba Eventos usa; o ultimo reaproveita
// lerEstatisticasMembros no Code.gs, o mesmo motor que ja alimenta a aba
// Presencas do Modo organizador.
async function loadRelatorioEstatisticas() {
  state.relatorioEstatisticasLoading = true;
  state.relatorioEstatisticasError = null;
  render();
  try {
    // No Regional, respeita o filtro de divisao do painel - categoria vazia
    // e o proprio sinal que lerEstatisticasMembros usa pra "sem filtro,
    // todo mundo" (ver Code.gs), entao "todas" vira uma string vazia.
    const categoria = state.relatorioEscopo !== 'regional' ? state.relatorioEscopo
      : (state.relatorioFiltroDivisao === 'todas' ? '' : state.relatorioFiltroDivisao);
    const r = await api('estatisticas', { categoria });
    state.relatorioEstatisticas = r.membros || [];
  } catch (e) {
    state.relatorioEstatisticasError = e.message;
  }
  state.relatorioEstatisticasLoading = false;
  render();
}

// yyyy-MM-dd de N meses atras, no fuso local - mesma ideia de dataCorte no
// Code.gs, so que calculada no navegador (aqui nao precisamos ler a
// planilha de novo, so filtrar o que ja esta em state.events/reportData).
function dataCorteMeses(meses) {
  const d = new Date();
  d.setMonth(d.getMonth() - meses);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

const RELATORIO_PERIODOS = [1, 3, 6, 12];

// Donut de status em SVG puro (sem biblioteca) - um anel por segmento,
// usando stroke-dasharray/dashoffset; numero central + legenda com
// swatch+valor, pra identidade nunca depender so da cor (segue a mesma
// regra de acessibilidade das outras telas do app). "centro"/"centroLabel"
// ficam sobrepostos ao SVG num div posicionado por cima.
function renderDonutChart(segments, centro, centroLabel, tamanho) {
  tamanho = tamanho || 120;
  const total = segments.reduce((s, x) => s + x.value, 0);
  const cx = tamanho / 2, cy = tamanho / 2, espessura = Math.round(tamanho * 0.133), r = cx - espessura / 2 - 2;
  const C = 2 * Math.PI * r;
  let acumulado = 0;
  const comDados = segments.filter(s => s.value > 0);
  const arcos = total && comDados.length ? comDados.map(s => {
    const frac = s.value / total;
    const arco = `
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" style="stroke:${s.cor}" stroke-width="${espessura}"
        stroke-dasharray="${(frac * C).toFixed(2)} ${C.toFixed(2)}"
        stroke-dashoffset="${(-acumulado * C).toFixed(2)}"
        transform="rotate(-90 ${cx} ${cy})"></circle>
    `;
    acumulado += frac;
    return arco;
  }).join('') : `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" style="stroke:var(--surface-alt)" stroke-width="${espessura}"></circle>`;
  const fonteCentro = Math.round(tamanho * 0.183), fonteLabel = Math.round(tamanho * 0.075);

  return `
    <div class="donut-wrap">
      <div style="position:relative; width:${tamanho}px; height:${tamanho}px; flex-shrink:0;">
        <svg width="${tamanho}" height="${tamanho}" viewBox="0 0 ${tamanho} ${tamanho}">${arcos}</svg>
        <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center;">
          <div style="font-size:${fonteCentro}px; font-weight:700; color:var(--white-strong); line-height:1;">${escapeHtml(String(centro))}</div>
          <div style="font-size:${fonteLabel}px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; margin-top:3px;">${escapeHtml(centroLabel)}</div>
        </div>
      </div>
      <div class="donut-legend">
        ${segments.map(s => `
          <div class="donut-legend-item">
            <span class="donut-swatch" style="background:${s.cor};"></span>
            <span class="donut-legend-label">${escapeHtml(s.label)}</span>
            <span class="donut-legend-value">${s.value}${total ? ' · ' + Math.round(s.value / total * 100) + '%' : ''}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// Status agrupado em 4 fatias (confirmado/aguardando/faltas justificadas/
// faltas infracionais) para o donut - familia+trabalho+justificada viram
// uma unica fatia, igual ao que buildReportText ja agrupa.
function segmentosDonutStatus(statusPeriodo) {
  return [
    { label: 'Confirmado', value: statusPeriodo.confirmado, cor: 'var(--status-confirmado)' },
    { label: 'Aguardando', value: statusPeriodo.aguardando, cor: 'var(--status-aguardando)' },
    { label: 'Faltas justificadas', value: statusPeriodo.justificada, cor: 'var(--status-justificada)' },
    { label: 'Faltas infracionais', value: statusPeriodo.infracional, cor: 'var(--status-infracional)' },
  ];
}

// Quem mais acumulou falta infracional num periodo - separado do "% de cada
// integrante" (que mistura confirmado/aguardando/faltas justificadas na
// mesma media) porque infracional e o dado que interessa pra acao
// disciplinar, e fica diluido demais dentro de uma % geral.
function rankingFaltasInfracionais(encerrados, meses) {
  const corte = dataCorteMeses(meses);
  const porMembro = {};
  encerrados.forEach(ev => {
    if (!ev.data || ev.data < corte) return;
    const statusData = state.reportData[ev.id];
    if (!statusData) return;
    ev.memberIds.forEach(mid => {
      const s = (statusData[mid] && statusData[mid].status) || 'aguardando';
      if (s === 'infracional') porMembro[mid] = (porMembro[mid] || 0) + 1;
    });
  });
  return Object.keys(porMembro)
    .map(id => {
      const m = state.roster.find(r => r.id === id);
      return { id, nome: m ? m.nome : id, divisao: m ? m.divisao : '', total: porMembro[id] };
    })
    .sort((a, b) => b.total - a.total || a.nome.localeCompare(b.nome));
}

// Painel opcional acima de "% de cada integrante", no mesmo periodo
// escolhido pro card "Presenca total" (ver renderDonutCard) - some sozinho
// quando ninguem tem falta infracional no periodo, pra nao virar um card
// vazio disputando espaco com o resto do resumo.
function renderRankingFaltasInfracionais(encerrados) {
  const meses = state.relatorioPeriodoPorGrafico.total || 3;
  const mostrarDivisao = state.relatorioEscopo === 'regional' && state.relatorioFiltroDivisao === 'todas';
  const ranking = rankingFaltasInfracionais(encerrados, meses).filter(r => r.total > 0).slice(0, 8);
  if (!ranking.length) return '';
  return `
    <div class="card" style="margin-top:14px;">
      <div style="font-weight:600; margin-bottom:2px;">⚠️ Mais faltas infracionais</div>
      <div style="color:var(--text-muted); font-size:12px; margin-bottom:8px;">Últimos ${meses === 1 ? 'mês' : meses + ' meses'}</div>
      ${ranking.map(r => `
        <div class="info-line" style="display:flex; justify-content:space-between; align-items:center;">
          <span>${escapeHtml(r.nome)}${mostrarDivisao && r.divisao ? ` <span style="color:var(--text-muted); font-size:11.5px;">· ${escapeHtml(r.divisao)}</span>` : ''}</span>
          <span style="font-weight:700; color:var(--status-infracional);">${r.total}</span>
        </div>
      `).join('')}
    </div>
  `;
}

// Resumo de um grafico (chave = 'total' ou um TIPOS_EVENTO) numa janela de
// meses: soma por status (pro donut), % geral e a lista de eventos que
// entraram na conta (pro drill-down em "Ver eventos").
function resumoDonutPeriodo(encerrados, chave, meses) {
  const corte = dataCorteMeses(meses);
  const doGrupo = encerrados.filter(ev => chave === 'total' || ev.tipo === chave);
  let somaConfirmados = 0, somaConvidados = 0, eventosNoPeriodo = 0, faltaCarregar = false;
  const statusPeriodo = { confirmado: 0, aguardando: 0, justificada: 0, infracional: 0 };
  const itens = [];
  doGrupo.forEach(ev => {
    if (!ev.data || ev.data < corte) return;
    if (!state.reportData[ev.id]) { faltaCarregar = true; return; }
    const c = computeCounts(ev);
    const total = ev.memberIds.length;
    somaConfirmados += c.confirmado;
    somaConvidados += total;
    eventosNoPeriodo++;
    statusPeriodo.confirmado += c.confirmado;
    statusPeriodo.aguardando += c.aguardando;
    statusPeriodo.justificada += c.familia + c.trabalho + c.justificada;
    statusPeriodo.infracional += c.infracional;
    itens.push({ ev, confirmado: c.confirmado, total, pct: total ? Math.round((c.confirmado / total) * 100) : null });
  });
  itens.sort((a, b) => (b.ev.data || '').localeCompare(a.ev.data || ''));
  return {
    pct: somaConvidados ? Math.round((somaConfirmados / somaConvidados) * 100) : null,
    statusPeriodo, somaConfirmados, somaConvidados, eventosNoPeriodo, itens, faltaCarregar
  };
}

// Um card do painel: titulo, chips de periodo proprios, donut e a contagem
// de eventos embaixo - "total" vem maior e centralizado (destaque = true).
// Linha de tendencia (sparkline) em SVG puro - mesma tecnica de
// stroke-dasharray/path do donut, sem lib nenhuma. So conecta pontos com %
// valido (eventos ainda sem reportData carregado ficam de fora da linha em
// vez de virar um buraco em 0%, que mentiria sobre a presenca). Usada so no
// card "Presença total" (destaque) - nos 4 cards de tipo, lado a lado num
// grid pequeno, o grafico ficaria pequeno demais pra informar algo.
function renderSparklineTendencia(itens) {
  const cronologico = itens.slice().sort((a, b) => (a.ev.data || '').localeCompare(b.ev.data || ''));
  const validos = cronologico.filter(x => x.pct !== null);
  if (validos.length < 2) return '';

  const largura = 280, altura = 56, margem = 6;
  const n = cronologico.length;
  const pontos = cronologico.map((x, i) => ({
    x: n > 1 ? margem + (i / (n - 1)) * (largura - margem * 2) : largura / 2,
    y: x.pct === null ? null : altura - margem - (x.pct / 100) * (altura - margem * 2),
    pct: x.pct, nome: x.ev.nome, data: x.ev.data
  }));

  let caminho = '';
  pontos.forEach(p => { if (p.y !== null) caminho += (caminho ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ' '; });
  const bolinhas = pontos.filter(p => p.y !== null).map(p => `
    <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="var(--white-strong)">
      <title>${escapeHtml(p.nome)}${p.data ? ' — ' + formatDataBR(p.data) : ''}: ${p.pct}%</title>
    </circle>
  `).join('');

  return `
    <div style="margin-top:10px;">
      <svg width="100%" height="${altura}" viewBox="0 0 ${largura} ${altura}" preserveAspectRatio="none" style="display:block;">
        <path d="${caminho.trim()}" fill="none" stroke="var(--white-strong)" stroke-width="1.5"></path>
        ${bolinhas}
      </svg>
      <div style="display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-muted); margin-top:2px;">
        <span>${cronologico[0].ev.data ? formatDataBR(cronologico[0].ev.data) : ''}</span>
        <span>${cronologico[cronologico.length - 1].ev.data ? formatDataBR(cronologico[cronologico.length - 1].ev.data) : ''}</span>
      </div>
    </div>
  `;
}

function renderDonutCard(titulo, chave, encerrados, destaque) {
  const meses = state.relatorioPeriodoPorGrafico[chave] || 3;
  const r = resumoDonutPeriodo(encerrados, chave, meses);
  const emoji = chave === 'total' ? '🏁' : emojiTipoEvento(chave);
  return `
    <div class="card donut-card${destaque ? ' donut-card-total' : ''}">
      <div style="font-weight:600; margin-bottom:8px;">${emoji} ${escapeHtml(titulo)}</div>
      <div class="chip-grid wide" style="margin-bottom:10px;">
        ${RELATORIO_PERIODOS.map(m => `
          <button class="chip-option ${meses === m ? 'active' : ''}" data-action="set-relatorio-periodo-tipo" data-chave="${escapeHtml(chave)}" data-value="${m}">${m === 1 ? '1 mês' : m + ' meses'}</button>
        `).join('')}
      </div>
      ${r.faltaCarregar ? '<div class="empty">Carregando…</div>' : renderDonutChart(segmentosDonutStatus(r.statusPeriodo), r.pct === null ? '—' : r.pct + '%', 'presença', destaque ? 150 : 110)}
      <div class="info-line" style="padding:8px 0 0; color:var(--text-muted); font-size:12px;">
        ${r.eventosNoPeriodo} ${r.eventosNoPeriodo === 1 ? 'evento encerrado' : 'eventos encerrados'} nesse período
      </div>
      ${destaque && !r.faltaCarregar ? renderSparklineTendencia(r.itens) : ''}
      ${r.itens.length ? `<div class="btn ghost" style="margin-top:6px; padding:4px 0;" data-action="abrir-relatorio-tipo-detalhe" data-value="${escapeHtml(chave)}">Ver eventos ›</div>` : ''}
    </div>
  `;
}

// Drill-down de um card (chave = 'total' ou um tipo): grafico de barras +
// tabela dos eventos que entraram na janela escolhida naquele card.
function conteudoRelatorioTipoDetalhe(encerrados, chave) {
  const meses = state.relatorioPeriodoPorGrafico[chave] || 3;
  const r = resumoDonutPeriodo(encerrados, chave, meses);
  const titulo = chave === 'total' ? 'Presença total' : chave;
  const emoji = chave === 'total' ? '🏁' : emojiTipoEvento(chave);
  return `
    <div class="card" style="margin-bottom:14px;">
      <div class="btn ghost" style="margin-bottom:10px;" data-action="fechar-relatorio-tipo-detalhe">‹ Voltar ao painel</div>
      <div style="font-weight:600; margin-bottom:8px;">${emoji} ${escapeHtml(titulo)}</div>
      ${!r.itens.length ? '<div class="empty">Nenhum evento encerrado nesse período.</div>' : `
        ${r.itens.map(({ ev, pct }) => `
          <div class="chart-row">
            <div class="chart-row-label" title="${escapeHtml(ev.nome)}">${escapeHtml(ev.nome)}</div>
            <div class="chart-row-track"><div class="chart-row-fill" style="width:${pct || 0}%"></div></div>
            <div class="chart-row-value">${pct === null ? '…' : pct + '%'}</div>
          </div>
        `).join('')}
        <div style="overflow-x:auto; margin-top:10px;">
          <table class="relatorio-tabela">
            <thead><tr><th>Evento</th><th>Data</th><th style="text-align:right;">Confirmados</th><th style="text-align:right;">%</th></tr></thead>
            <tbody>
              ${r.itens.map(({ ev, pct, confirmado, total }) => `
                <tr>
                  <td>${escapeHtml(ev.nome)}</td>
                  <td>${ev.data ? formatDataBR(ev.data) : '—'}</td>
                  <td class="num">${confirmado === null ? '…' : confirmado + '/' + total}</td>
                  <td class="num">${pct === null ? '…' : pct + '%'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;
}

// % de cada integrante calculado so a partir dos eventos ENCERRADOS de um
// tipo especifico - diferente de state.relatorioEstatisticas (que vem do
// Code.gs e ignora tipo, olha a divisao toda). Convites conta so eventos
// daquele tipo em que o membro foi convidado (tem linha em Presencas);
// confirmacoes so as que tem status "confirmado". Roster/eventos respeitam
// o filtro de divisao do painel (membrosVisiveisRelatorio/eventosDoRelatorioEscopo).
function estatisticasMembrosPorTipo(tipo) {
  const membros = membrosVisiveisRelatorio();
  const eventosTipo = eventosDoRelatorioEscopo().filter(e => e.status === 'encerrado' && e.tipo === tipo);

  const contagem = {};
  eventosTipo.forEach(ev => {
    const presencas = state.reportData[ev.id];
    if (!presencas) return;
    ev.memberIds.forEach(mid => {
      if (!contagem[mid]) contagem[mid] = { convites: 0, confirmacoes: 0 };
      contagem[mid].convites++;
      if (presencas[mid] && presencas[mid].status === 'confirmado') contagem[mid].confirmacoes++;
    });
  });

  return membros.map(m => {
    const c = contagem[m.id] || { convites: 0, confirmacoes: 0 };
    return {
      id: m.id, nome: m.nome, grau: m.grau, divisao: m.divisao, funcoes: m.funcoes,
      convites: c.convites, confirmacoes: c.confirmacoes,
      percentual: c.convites ? Math.round((c.confirmacoes / c.convites) * 100) : null
    };
  });
}

// Agrupa uma lista de estatisticas de membro (precisa de nome/divisao/
// percentual) por divisao - Regional primeiro, resto em ordem alfabetica
// (mesmo criterio de agruparPorDivisao), mantendo dentro de cada grupo a
// ordenacao por % (maior primeiro), que e o que da sentido a lista.
function agruparStatsPorDivisao(lista) {
  const porDivisao = {};
  lista.forEach(item => {
    const chave = item.divisao || 'Sem divisão';
    (porDivisao[chave] = porDivisao[chave] || []).push(item);
  });
  const nomeRegional = escopoPorChave('regional').nome;
  const ordenadas = Object.keys(porDivisao).sort((a, b) => {
    if (a === nomeRegional) return -1;
    if (b === nomeRegional) return 1;
    return a.localeCompare(b);
  });
  return ordenadas.map(divisao => ({
    divisao,
    itens: [...porDivisao[divisao]].sort((a, b) => {
      if (a.percentual === null && b.percentual === null) return a.nome.localeCompare(b.nome);
      if (a.percentual === null) return 1;
      if (b.percentual === null) return -1;
      return b.percentual - a.percentual || a.nome.localeCompare(b.nome);
    })
  }));
}

// Uma linha de "% de cada integrante" - nome + grau (herdado do cadastro,
// mesmo selo usado no resto do app) + selos de funcao, pra nao ficar so uma
// lista nua de nomes.
function renderLinhaEstatisticaMembro(m) {
  const nomeComGrau = `${escapeHtml(m.nome)}${m.grau ? ` <span class="grade-box">${escapeHtml(m.grau)}</span>` : ''}`;
  if (m.percentual === null) {
    return `
      <div class="card presenca-row">
        <div class="presenca-info">
          <div class="presenca-nome">${nomeComGrau}</div>
          ${linhaFuncoes(m.funcoes)}
        </div>
        <div class="presenca-sem-dados">Sem eventos ainda</div>
      </div>
    `;
  }
  return `
    <div class="card presenca-row">
      <div class="presenca-info">
        <div class="presenca-nome">${nomeComGrau}</div>
        ${linhaFuncoes(m.funcoes)}
        <div class="presenca-contagem">${m.confirmacoes} de ${m.convites} eventos</div>
      </div>
      <div class="presenca-pct-wrap">
        <div class="presenca-barra"><div class="presenca-barra-fill" style="width:${m.percentual}%"></div></div>
        <div class="presenca-pct">${m.percentual}%</div>
      </div>
    </div>
  `;
}

// "% de cada integrante" agrupada por divisao, com cabecalho recolhivel
// (mesmo padrao visual de renderSubtituloDivisao/Rank de Insights) - sem
// isso, o Regional com "Todas as divisões" vira uma lista sem fim de nomes
// soltos, dificil de achar alguem.
function renderListaEstatisticasPorDivisao(lista) {
  const grupos = agruparStatsPorDivisao(lista);
  return grupos.map(grupo => {
    const aberto = state.relatorioEstatisticasExpandidas.has(grupo.divisao);
    return `
      <div class="division-subheader clicavel" data-action="toggle-relatorio-estatisticas-divisao" data-value="${escapeHtml(grupo.divisao)}">
        <span>${aberto ? '▾' : '▸'} ${escapeHtml(grupo.divisao.toUpperCase())}</span>
        <span class="division-counts">${grupo.itens.length} ${grupo.itens.length === 1 ? 'membro' : 'membros'}</span>
      </div>
      ${aberto ? grupo.itens.map(renderLinhaEstatisticaMembro).join('') : ''}
    `;
  }).join('');
}

// Uma das 4 abas fixas "Relatorio Pub/Bate e Volta/Reuniao/Acao Social":
// so a tabela de % por evento daquele tipo (sem grafico, sem chips de
// periodo - todo o historico) + a % de cada integrante so naquele tipo.
function conteudoRelatorioTipoFixo(tipo) {
  const eventosTipo = eventosDoRelatorioEscopo()
    .filter(e => e.status === 'encerrado' && e.tipo === tipo)
    .sort((a, b) => (b.data || '').localeCompare(a.data || ''));
  const faltaCarregar = eventosTipo.some(e => !(e.id in state.reportData));

  const linhas = eventosTipo.map(ev => {
    const c = state.reportData[ev.id] ? computeCounts(ev) : null;
    const total = ev.memberIds.length;
    return { ev, confirmado: c ? c.confirmado : null, total, pct: c && total ? Math.round((c.confirmado / total) * 100) : null };
  });

  const membros = estatisticasMembrosPorTipo(tipo);

  return `
    <div class="card" style="margin-bottom:14px;">

// Google Sheets recusa lote grande demais de leituras ao mesmo tempo ("Muitos
// pedidos simultaneos"). Antes disso so acontecia com dezenas de eventos
// (ex.: depois de gerarDadosFakeTeste); disparando tudo de uma vez com
// Promise.allSettled, como fazia antes, o navegador manda uma leitura por
// evento em paralelo sem limite nenhum. Aqui o mesmo trabalho e feito em
// lotes pequenos, um atras do outro - mais lento, mas nao esbarra no limite.
async function emLotes(itens, tamanhoDoLote, tarefa) {
  const resultados = [];
  for (let i = 0; i < itens.length; i += tamanhoDoLote) {
    const lote = itens.slice(i, i + tamanhoDoLote);
    const parciais = await Promise.allSettled(lote.map(tarefa));
    resultados.push(...parciais);
  }
  return resultados;
}

async function loadReportData() {
  const encerrados = state.events.filter(e => e.status === 'encerrado');
  const missing = encerrados.filter(e => !(e.id in state.reportData));
  state.reportError = null;
  if (missing.length) {
    const results = await emLotes(missing, 5, e => api('presencas', { eventoId: e.id }));
    missing.forEach((e, i) => {
      // Um evento sem dado fica de fora de propósito: melhor mostrar traço do
      // que um relatorio dizendo que ninguem confirmou.
      if (results[i].status === 'fulfilled') state.reportData[e.id] = results[i].value.presencas || {};
      else state.reportError = results[i].reason.message;
    });
  }
  render();
}

function computeCounts(ev) {
  const statusData = state.reportData[ev.id] || {};
  const counts = { confirmado: 0, familia: 0, trabalho: 0, aguardando: 0, justificada: 0, infracional: 0 };
  ev.memberIds.forEach(mid => {
    const s = (statusData[mid] && statusData[mid].status) || 'aguardando';
    if (counts[s] !== undefined) counts[s]++; else counts.aguardando++;
  });
  return counts;
}

function getReportGroups(ev) {
  const statusData = state.reportData[ev.id] || {};
  const groups = { confirmado: [], familia: [], trabalho: [], aguardando: [], justificada: [], infracional: [] };
  ev.memberIds.forEach(mid => {
    const m = state.roster.find(r => r.id === mid);
    if (!m) return;
    const s = (statusData[mid] && statusData[mid].status) || 'aguardando';
    (groups[s] || groups.aguardando).push(m.nome);
  });
  return groups;
}

function buildReportText(ev) {
  const groups = getReportGroups(ev);
  // Familia, trabalho e justificada sao razoes de falta justificada; juntas
  // viram uma unica secao "nao puderam ir", com o motivo ao lado de cada nome.
  const naoPuderamIr = [
    ...groups.familia.map(n => ({ nome: n, motivo: 'Família' })),
    ...groups.trabalho.map(n => ({ nome: n, motivo: 'Trabalho' })),
    ...groups.justificada.map(n => ({ nome: n, motivo: 'Justificada' })),
  ];

  const total = ev.memberIds.length;
  const percentual = total ? Math.round((groups.confirmado.length / total) * 100) : 0;

  const lines = [];
  lines.push('📋 RELATÓRIO DE PRESENÇA');
  lines.push(ev.nome);
  if (ev.data) lines.push('🗓️ ' + formatDataBR(ev.data));
  if (ev.endereco) lines.push('📍 ' + ev.endereco);
  lines.push('');
  lines.push(`📊 ${percentual}% DE PRESENÇA (${groups.confirmado.length} de ${total})`);
  lines.push('');
  lines.push(`✅ CONFIRMARAM (${groups.confirmado.length})`);
  lines.push(...(groups.confirmado.length ? groups.confirmado.map(n => '- ' + n) : ['- Ninguém confirmou']));
  lines.push('');
  lines.push(`❌ NÃO PUDERAM IR (${naoPuderamIr.length})`);
  lines.push(...(naoPuderamIr.length ? naoPuderamIr.map(m => `- ${m.nome} (${m.motivo})`) : ['- Ninguém avisou falta']));
  lines.push('');
  lines.push(`⚠️ NÃO RESPONDERAM (${groups.aguardando.length})`);
  lines.push(...(groups.aguardando.length ? groups.aguardando.map(n => '- ' + n) : ['- Todos responderam']));
  lines.push('');
  lines.push(`⭕ FALTA INFRACIONAL (${groups.infracional.length})`);
  lines.push(...(groups.infracional.length ? groups.infracional.map(n => '- ' + n) : ['- Nenhuma']));
  return lines.join('\n');
}

async function copyReportToClipboard(ev) {
  const text = buildReportText(ev);
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      ok = true;
    } catch (e2) {
      ok = false;
    }
  }
  if (ok) {
    state.copiedEventId = ev.id;
    render();
    setTimeout(() => {
      if (state.copiedEventId === ev.id) {
        state.copiedEventId = null;
        render();
      }
    }, 1600);
  }
}

      <div style="font-size:13.5px; color:var(--text); line-height:1.6;">${list.map(escapeHtml).join(', ')}</div>
    </div>
  ` : '';
  return `
    <div style="border-top:1px solid var(--line); margin-top:12px; padding-top:2px;">
      ${section('Confirmados', '✅', groups.confirmado)}
      ${section('Falta - Família', '❌', groups.familia)}
      ${section('Falta - Trabalho', '❌', groups.trabalho)}
      ${section('Não responderam', '⚠️', groups.aguardando)}
    </div>
  `;
}

function renderAdmin(app) {
  app.innerHTML = `
    <div class="back-link on-photo" data-action="go-divisoes">‹ Trocar divisão</div>
    <div class="event-header">
      <h1 style="font-size: 20px;">Organizador</h1>
      <div class="count-box">${escapeHtml(escopoPorChave(state.adminEscopo).nome.toUpperCase())}</div>
    </div>
    <div class="tabs">
      <div class="tab ${state.adminTab === 'eventos' ? 'active' : ''}" data-action="admin-tab" data-tab="eventos">Eventos</div>
      <div class="tab ${state.adminTab === 'membros' ? 'active' : ''}" data-action="admin-tab" data-tab="membros">Membros</div>
      <div class="tab ${state.adminTab === 'relatorio' ? 'active' : ''}" data-action="admin-tab" data-tab="relatorio">Relatório</div>
      <div class="tab ${state.adminTab === 'presencas' ? 'active' : ''}" data-action="admin-tab" data-tab="presencas">Presenças</div>
      ${state.adminEscopo === 'regional' ? `
        <div class="tab ${state.adminTab === 'insights' ? 'active' : ''}" data-action="admin-tab" data-tab="insights">Insights</div>
      ` : ''}
    </div>

function eventosDoEscopo() {
  return state.events.filter(ev => (ev.categoria || 'barra') === state.adminEscopo);
}

function renderAdminEventos() {
  if (state.newEventSelected !== null) {
    return renderEventForm();
  }
  const rel = state.relatorioState;
  const eventos = eventosDoEscopo();
  // A planilha inteira (aba Relatorio) cobre todas as divisoes juntas, entao
  // so faz sentido regenerar ela de dentro do Regional - quem enxerga o
  // quadro geral. Cada divisao usa o "Copiar relatorio" (por evento, na aba
  // Relatorio do organizador), que continua disponivel pra todo mundo.
  const podeGerarPlanilha = state.adminEscopo === 'regional';
  return `
    <button class="btn block" data-action="start-new-event" style="margin-bottom: 10px;">+ Criar evento</button>
    ${podeGerarPlanilha ? `
      <button class="btn secondary block on-photo" data-action="gerar-relatorio" style="margin-bottom: 6px;" ${rel === 'gerando' ? 'disabled' : ''}>
        ${rel === 'gerando' ? 'Gerando na planilha…' : '📊 Gerar relatório na planilha'}
      </button>
      ${rel === 'ok' ? '<div class="alert ok" style="margin-bottom:16px;"><div class="alert-msg">✅ Relatório atualizado na aba <b>Relatorio</b> da planilha.</div></div>' : ''}
      ${rel === 'erro' ? `<div class="alert" style="margin-bottom:16px;"><div class="alert-title">Não consegui gerar</div><div class="alert-msg">${escapeHtml(state.relatorioErro || '')}.</div></div>` : ''}
      ${rel !== 'ok' && rel !== 'erro' ? '<div style="margin-bottom:16px;"></div>' : ''}
    ` : '<div style="margin-bottom:16px;"></div>'}
    ${eventos.length === 0 ? '<div class="empty">Nenhum evento criado ainda.</div>' : eventos.map(ev => {
      const memberCount = ev.memberIds.length;
      return `
        <div class="card">
          <div style="display:flex; justify-content: space-between; align-items:flex-start;">
            <div>
              <div style="font-family:'Rye',serif; font-size:17px; color: var(--white-strong);">${escapeHtml(ev.nome)}${ev.tipo ? ' ' + emojiTipoEvento(ev.tipo) : ''}</div>
              <div style="color:var(--text-muted); font-size:12px; margin-top:5px;">${memberCount} membros · ${ev.status === 'encerrado' ? 'Encerrado' : 'Ativo'}</div>
            </div>
          </div>
          <div class="row-gap" style="margin-top:12px;">
            <button class="btn secondary" data-action="start-edit-event" data-id="${ev.id}">Editar</button>
            <button class="btn secondary" data-action="toggle-event-status" data-id="${ev.id}">${ev.status === 'encerrado' ? 'Reabrir' : 'Encerrar'}</button>
          </div>
        </div>
      `;
    }).join('')}
  `;
}

// Evento regional convida gente de todas as divisoes (Regional incluso);
// evento de uma divisao especifica so pode convidar os proprios membros.

  return state.adminEscopo === 'regional' ? state.roster : membrosDoEscopo();
}

      </div>

      </div>
      <div style="display:flex; align-items:baseline; justify-content:space-between; gap:8px;">

        ${elegiveis.length > 0 ? `
          <div>
            <span class="btn ghost" style="padding:0;" data-action="marcar-todos-membros">Marcar todos</span>
            <span style="color:var(--text-muted);"> · </span>
            <span class="btn ghost" style="padding:0;" data-action="desmarcar-todos-membros">Desmarcar todos</span>

            <label for="chk-${m.id}" style="margin:0; font-size:14.5px; color:var(--text);">${escapeHtml(m.nome)}${m.grau ? ' (' + escapeHtml(m.grau) + ')' : ''}</label>

        `).join('')}

      <div class="row-gap">
        <button class="btn" data-action="save-new-event">${isEditing ? 'Salvar alterações' : 'Criar evento'}</button>

// So os membros da divisao (ou Regional) que o organizador esta gerenciando
// agora - mesma logica de eventosDoEscopo(), pro organizador de uma divisao
// nao ver nem poder mexer nos membros de outra.
function membrosDoEscopo() {
  const nome = escopoPorChave(state.adminEscopo).nome;
  return state.roster.filter(m => m.divisao === nome);
}

  const editando = !!state.editingMemberId;
  return `
    <div class="card">
      ${editando ? '<label style="display:block; margin-bottom:8px; color:var(--text-muted); font-size:12px;">Editando membro</label>' : ''}

      <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding: 12px 16px;">
        <div>
          <div style="font-weight:500; font-size:15px;">${escapeHtml(m.nome)} ${selosFuncoes(m.funcoes)}</div>
          <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">${[m.grau, m.divisao].filter(Boolean).map(escapeHtml).join(' · ') || '—'}</div>

        <div class="row-gap" style="margin-bottom:0;">

// Selos compactos de funcao, usados na lista de Membros (aba do organizador).
function selosFuncoes(funcoes) {
  if (!funcoes || !funcoes.length) return '';
  return funcoes.map(chave => {
    const f = funcaoPorChave(chave);
    return f ? `<span class="grade-box" title="${escapeHtml(f.label)}">${f.selo}</span>` : '';
  }).join(' ');
}

// Linha propria de funcao, so com os selos - usada na lista de participantes
// de um evento, numa linha separada do nome e dos status de confirmacao
// (Direto/Destacado/Acompanhado), para nao virar uma sopa de emoji dificil de
// distinguir o que e o que. O significado de cada selo fica na legenda, no
// rodape da tela do evento - mesmo padrao dos outros emojis do app.
function linhaFuncoes(funcoes) {
  if (!funcoes || !funcoes.length) return '';
  const itens = funcoes.map(chave => {
    const f = funcaoPorChave(chave);
    return f ? `<span class="funcao-item" title="${escapeHtml(f.label)}">${f.selo}</span>` : '';
  }).filter(Boolean).join('');
  return itens ? `<div class="member-funcoes">${itens}</div>` : '';
}

// ---------- ACTIONS ----------

document.getElementById('app').addEventListener('input', (e) => {
  if (e.target.id === 'new-member-nome') {
    state.newMemberNome = e.target.value;
  }
  if (e.target.id === 'relatorio-texto-field') {
    state.relatorioTextoBruto = e.target.value;
  }
  if (e.target.dataset && e.target.dataset.action === 'resolver-membro') {
    const i = Number(e.target.dataset.index);
    const row = state.relatorioParsed.membrosParsed[i];
    row.membroId = e.target.value || null;
    row.sugestoes = [];
    render();
  }
});

document.getElementById('app').addEventListener('click', async (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  const id = target.dataset.id;

  if (action === 'retry-load') return loadInitial();
  if (action === 'retry-report') return loadReportData();
  if (action === 'retry-estatisticas') return loadEstatisticas();
  if (action === 'retry-relatorio-estatisticas') return loadRelatorioEstatisticas();
  if (action === 'toggle-relatorio-estatisticas-divisao') {
    const chave = target.dataset.value;
    if (state.relatorioEstatisticasExpandidas.has(chave)) state.relatorioEstatisticasExpandidas.delete(chave);
    else state.relatorioEstatisticasExpandidas.add(chave);
    return render();
  }
  if (action === 'toggle-relatorio-eventos-divisao') {
    const chave = target.dataset.value;
    if (state.relatorioEventosExpandidos.has(chave)) state.relatorioEventosExpandidos.delete(chave);
    else state.relatorioEventosExpandidos.add(chave);
    return render();
  }
  if (action === 'set-relatorio-periodo-tipo') {
    state.relatorioPeriodoPorGrafico[target.dataset.chave] = Number(target.dataset.value);
    return render();
  }
  if (action === 'abrir-relatorio-tipo-detalhe') {
    state.relatorioTipoDetalhe = target.dataset.value;
    return render();
  }
  if (action === 'set-relatorio-filtro-divisao') {
    state.relatorioFiltroDivisao = target.dataset.value;
    state.relatorioTipoDetalhe = null;
    render();
    await loadRelatorioEstatisticas();
    return;
  }
  if (action === 'fechar-relatorio-tipo-detalhe') {
    state.relatorioTipoDetalhe = null;
    return render();
  }
  if (action === 'retry-relatorio-eventos') return loadReportData();
  if (action === 'retry-insight-stats') return loadInsightStats();
  if (action === 'retry-save') return gravarAgora();
  if (action === 'gerar-relatorio') return gerarRelatorio();
  if (action === 'ask-delete-event') { state.confirmDeleteId = id; return render(); }
  if (action === 'cancel-delete-event') { state.confirmDeleteId = null; return render(); }
  if (action === 'retry-status') return loadEventStatus(state.currentEventId);
  if (action === 'open-event') return openEvent(id);
  if (action === 'go-home') { state.view = 'home'; state.isAdmin = false; state.adminEscopo = null; return render(); }
  if (action === 'abrir-home-eventos') { state.homeEventosAberto = true; return render(); }
  if (action === 'fechar-home-eventos') { state.homeEventosAberto = false; state.homeEscopo = null; state.homeTipo = null; return render(); }
  if (action === 'select-home-escopo') { state.homeEscopo = target.dataset.value; state.homeTipo = null; return render(); }
  if (action === 'go-home-escolha') { state.homeEscopo = null; state.homeTipo = null; state.view = 'home'; return render(); }
  if (action === 'select-home-tipo') { state.homeTipo = target.dataset.value; return render(); }
  if (action === 'go-home-tipos') { state.homeTipo = null; return render(); }
  if (action === 'go-rank') { state.view = 'rank'; return render(); }
  if (action === 'calcular-rank') return carregarRank();
  if (action === 'set-rank-janela') {
    state.rankJanela = target.dataset.value;
    // Se ja tinha calculado antes, recalcula na hora pra nova janela -
    // senao so troca a selecao, esperando o toque em "Calcular rank".
    return state.rankData ? carregarRank() : render();
  }
  if (action === 'toggle-rank-divisao') {
    const chave = target.dataset.value;
    if (state.rankExpandedDivisoes.has(chave)) state.rankExpandedDivisoes.delete(chave);
    else state.rankExpandedDivisoes.add(chave);
    return render();
  }
  if (action === 'go-rank-insights') {
    state.view = 'rank-insights';
    return carregarRankInsights();
  }
  if (action === 'toggle-insight-rank-divisao') {
    const chave = target.dataset.value;
    if (state.insightRankExpandedDivisoes.has(chave)) state.insightRankExpandedDivisoes.delete(chave);
    else state.insightRankExpandedDivisoes.add(chave);
    return render();
  }
  if (action === 'go-divisoes') { state.view = 'admin-divisoes'; return render(); }
  if (action === 'select-divisao') {
    state.adminEscopo = target.dataset.value;
    state.view = 'admin-pin';
    state.pinErro = null;
    return render();
  }
  if (action === 'check-pin') return checkPin();
  if (action === 'go-relatorio-divisoes') {
    state.view = 'relatorio-divisoes';
    state.relatorioTextoBruto = '';
    state.relatorioParsed = null;
    state.relatorioSalvarErro = null;
    state.relatorioDuplicidadeAviso = null;
    state.relatorioDuplicidadeConfirmada = false;
    state.relatorioTab = 'resumo';
    state.relatorioColarStep = 'texto';
    state.relatorioEstatisticas = null;
    state.relatorioCategoriaAlvo = null;
    state.relatorioTipoEscolhido = null;
    state.relatorioTipoDetalhe = null;
    state.relatorioFiltroDivisao = 'todas';
    state.relatorioEstatisticasExpandidas = new Set();
    state.relatorioEventosExpandidos = new Set();
    return render();
  }
  if (action === 'select-relatorio-divisao') {
    state.relatorioEscopo = target.dataset.value;
    // Padrao: a categoria alvo comeca igual ao escopo escolhido (Regional ->
    // "Regional", Barra -> "Barra") - so muda se a pessoa clicar num botao
    // de divisao especifica na tela de colar, ver "set-relatorio-categoria".
    state.relatorioCategoriaAlvo = target.dataset.value;
    state.view = 'relatorio-pin';
    state.relatorioPinErro = null;
    return render();
  }
  if (action === 'set-relatorio-categoria') {
    state.relatorioCategoriaAlvo = target.dataset.value;
    return render();
  }
  if (action === 'set-revisao-tipo') {
    state.relatorioParsed.evento.tipo = state.relatorioParsed.evento.tipo === target.dataset.value ? '' : target.dataset.value;
    return render();
  }
  if (action === 'set-relatorio-tipo') {
    state.relatorioTipoEscolhido = state.relatorioTipoEscolhido === target.dataset.value ? null : target.dataset.value;
    return render();
  }
  if (action === 'check-relatorio-pin') return checkRelatorioPin();
  if (action === 'relatorio-tab') {
    state.relatorioTab = target.dataset.tab;
    render();
    // Eventos, Resumo e as 4 abas de tipo dependem dos dados por evento -
    // sem isso quem for direto numa dessas abas (sem passar por outra que
    // ja carregou) fica com "Carregando…" pra sempre, ja que nada mais
    // dispara essa busca.
    const precisaReportData = ['eventos', 'resumo', ...TIPOS_EVENTO_TABS_ORDEM].includes(target.dataset.tab);
    if (precisaReportData) await loadReportData();
    if (target.dataset.tab === 'resumo') await loadRelatorioEstatisticas();
    return;
  }
  if (action === 'go-relatorio-texto') {
    state.relatorioColarStep = 'texto';
    state.relatorioDuplicidadeAviso = null;
    state.relatorioDuplicidadeConfirmada = false;
    return render();
  }
  if (action === 'analisar-convocacao') return analisarConvocacao();
  if (action === 'aceitar-sugestao') {
    const row = state.relatorioParsed.membrosParsed[Number(target.dataset.index)];
    row.membroId = target.dataset.id;
    row.sugestoes = [];
    return render();
  }
  if (action === 'ignorar-membro-parseado') {
    state.relatorioParsed.membrosParsed[Number(target.dataset.index)].ignorado = true;
    return render();
  }
  if (action === 'reincluir-membro-parseado') {
    state.relatorioParsed.membrosParsed[Number(target.dataset.index)].ignorado = false;
    return render();
  }
  if (action === 'confirmar-evento-parseado') return confirmarEventoParseado();
  if (action === 'cancelar-duplicidade-relatorio') { state.relatorioDuplicidadeAviso = null; return render(); }
  if (action === 'confirmar-duplicidade-relatorio') {
    state.relatorioDuplicidadeConfirmada = true;
    return confirmarEventoParseado();
  }
  if (action === 'nova-convocacao') {
    state.relatorioTextoBruto = '';
    state.relatorioParsed = null;
    state.relatorioSalvarErro = null;
    state.relatorioDuplicidadeAviso = null;
    state.relatorioDuplicidadeConfirmada = false;
    state.relatorioColarStep = 'texto';
    return render();
  }
  if (action === 'admin-tab') {
    state.adminTab = target.dataset.tab;
    state.newEventSelected = null;
    state.editingEventId = null;
    state.confirmDeleteId = null;
    state.editingMemberId = null;
    state.newMemberNome = '';
    state.newMemberGrau = null;
    state.newMemberFuncoes = new Set();
    state.insightConfirmDeleteRodadaId = null;
    state.insightResultado = null;
    state.insightMostrarExcluidos = false;
    render();
    if (target.dataset.tab === 'relatorio') await loadReportData();
    if (target.dataset.tab === 'presencas') await loadEstatisticas();
    if (target.dataset.tab === 'insights') await loadInsightStats();
    return;
  }
  if (action === 'toggle-insight-marca') {
    state.insightMarcacoes[id] = !state.insightMarcacoes[id];
    return render();
  }
  if (action === 'toggle-insight-divisao-grupo') {
    const chave = target.dataset.value;
    if (state.insightExpandedDivisoes.has(chave)) state.insightExpandedDivisoes.delete(chave);
    else state.insightExpandedDivisoes.add(chave);
    return render();
  }
  if (action === 'confirmar-insight-rodada') return confirmarInsightRodada();
  if (action === 'ask-delete-insight-rodada') { state.insightConfirmDeleteRodadaId = id; return render(); }
  if (action === 'cancel-delete-insight-rodada') { state.insightConfirmDeleteRodadaId = null; return render(); }
  if (action === 'delete-insight-rodada') return excluirInsightRodada(id);
  if (action === 'insight-remover-membro') return removerMembroInsight(id);
  if (action === 'insight-reincluir-membro') return reincluirMembroInsight(id);
  if (action === 'toggle-insight-excluidos') { state.insightMostrarExcluidos = !state.insightMostrarExcluidos; return render(); }
  if (action === 'toggle-report-event') {
    state.expandedReportEventId = state.expandedReportEventId === id ? null : id;
    return render();
  }
  if (action === 'copy-report') {
    const ev = state.events.find(e => e.id === id);
    if (ev) await copyReportToClipboard(ev);
    return;
  }

  if (action === 'toggle-member') {
    state.expandedMemberId = state.expandedMemberId === id ? null : id;
    return render();
  }
  if (action === 'toggle-confirmados') { state.view = 'confirmados'; return render(); }
  if (action === 'close-confirmados') { state.view = 'event'; return render(); }
  if (action === 'toggle-divisao-grupo') {
    const nome = target.dataset.value;
    if (state.expandedDivisoes.has(nome)) state.expandedDivisoes.delete(nome);
    else state.expandedDivisoes.add(nome);
    return render();
  }
  if (action === 'set-status') return setMemberStatus(id, { status: target.dataset.status });
  if (action === 'toggle-direto') {
    const cur = getMemberStatus(id);
    return setMemberStatus(id, { direto: !cur.direto });
  }
  if (action === 'toggle-destacado') {
    const cur = getMemberStatus(id);
    return setMemberStatus(id, { destacado: !cur.destacado });
  }
  if (action === 'toggle-acompanhado') {
    const cur = getMemberStatus(id);
    return setMemberStatus(id, { acompanhado: !cur.acompanhado });
  }

  if (action === 'pick-grau') {
    state.newMemberGrau = state.newMemberGrau === target.dataset.value ? null : target.dataset.value;
    return render();
  }
  if (action === 'toggle-funcao') {
    const chave = target.dataset.value;
    if (state.newMemberFuncoes.has(chave)) state.newMemberFuncoes.delete(chave);
    else state.newMemberFuncoes.add(chave);
    return render();
  }
  if (action === 'add-member') {
    const nome = (document.getElementById('new-member-nome').value || '').trim();
    if (!nome) return;
    // O membro herda a divisao de onde o organizador entrou - inclusive
    // Regional, que tem os proprios membros (mesa regional).
    const member = {
      id: genId(), nome, grau: state.newMemberGrau || '', divisao: escopoPorChave(state.adminEscopo).nome,
      funcoes: Array.from(state.newMemberFuncoes)
    };
    state.roster = [...state.roster, member];
    state.newMemberGrau = null;
    state.newMemberFuncoes = new Set();
    state.newMemberNome = '';
    render();
    await salvarOuAvisar('membroSalvar', { ...member, funcoes: member.funcoes.join(',') });
  }
  if (action === 'edit-member') {
    const m = state.roster.find(x => x.id === id);
    if (!m) return;
    state.editingMemberId = id;
    state.newMemberNome = m.nome;
    state.newMemberGrau = m.grau || null;
    state.newMemberFuncoes = new Set(m.funcoes || []);
    return render();
  }
  if (action === 'cancel-member-edit') {
    state.editingMemberId = null;
    state.newMemberNome = '';
    state.newMemberGrau = null;
    state.newMemberFuncoes = new Set();
    return render();
  }
  if (action === 'save-member-edit') {
    const nome = (document.getElementById('new-member-nome').value || '').trim();
    if (!nome) return;
    const original = state.roster.find(x => x.id === state.editingMemberId);
    if (!original) return;
    // Divisao nao muda por aqui - so nome, grau e funcoes.
    const member = {
      ...original, nome, grau: state.newMemberGrau || '',
      funcoes: Array.from(state.newMemberFuncoes)
    };
    state.roster = state.roster.map(x => x.id === member.id ? member : x);
    state.editingMemberId = null;
    state.newMemberGrau = null;
    state.newMemberFuncoes = new Set();
    state.newMemberNome = '';
    render();
    await salvarOuAvisar('membroSalvar', { ...member, funcoes: member.funcoes.join(',') });
  }
  if (action === 'remove-member') {
    state.roster = state.roster.filter(m => m.id !== id);
    render();
    await salvarOuAvisar('membroRemover', { id });
  }

  if (action === 'start-new-event') {
    state.newEventSelected = new Set(membrosElegiveisEvento().map(m => m.id));
    state.editingEventId = null;
    state.newEventTipo = null;
    return render();
  }
  if (action === 'start-edit-event') {
    const ev = state.events.find(e => e.id === id);
    if (!ev) return;
    state.editingEventId = id;
    state.newEventSelected = new Set(ev.memberIds);
    state.newEventTipo = ev.tipo || null;
    return render();
  }
  if (action === 'cancel-new-event') {
    state.newEventSelected = null;
    state.editingEventId = null;
    state.newEventTipo = null;
    return render();
  }
  if (action === 'marcar-todos-membros' || action === 'desmarcar-todos-membros') {
    // Mexe direto nos checkboxes, sem re-renderizar - o estado deles so e
    // lido de verdade na hora de salvar (ver save-new-event).
    const ligar = action === 'marcar-todos-membros';
    document.querySelectorAll('.new-event-checkbox').forEach(c => { c.checked = ligar; });
    return;
  }
  if (action === 'pick-tipo-evento') {
    state.newEventTipo = state.newEventTipo === target.dataset.value ? null : target.dataset.value;
    return render();
  }
  if (action === 'save-new-event') {
    const nome = document.getElementById('new-event-name').value.trim();
    const data = document.getElementById('new-event-data').value;
    const horario = document.getElementById('new-event-horario').value;
    const endereco = document.getElementById('new-event-endereco').value.trim();
    const outros = document.getElementById('new-event-outros').value.trim();
    const checked = Array.from(document.querySelectorAll('.new-event-checkbox:checked')).map(c => c.dataset.id);
    if (!nome || checked.length === 0) return;
    const evento = {
      id: state.editingEventId || genId(),
      nome, memberIds: checked, data, horario, endereco, outros,
      tipo: state.newEventTipo || '',
      // A categoria vem de qual botao o organizador entrou (Barra ou
      // Regional), nao de uma escolha manual no formulario.
      categoria: state.adminEscopo,
      status: state.editingEventId
        ? (state.events.find(e => e.id === state.editingEventId) || {}).status || 'ativo'
        : 'ativo'
    };
    state.events = state.editingEventId
      ? state.events.map(ev => ev.id === evento.id ? { ...ev, ...evento } : ev)
      : [...state.events, evento];
    state.newEventSelected = null;
    state.editingEventId = null;
    state.newEventTipo = null;
    render();
    await salvarOuAvisar('eventoSalvar', paramsDeEvento(evento));
  }
  if (action === 'toggle-event-status') {
    const ev = state.events.find(e => e.id === id);
    if (!ev) return;
    const novoStatus = ev.status === 'encerrado' ? 'ativo' : 'encerrado';
    state.events = state.events.map(e => e.id === id ? { ...e, status: novoStatus } : e);
    render();
    await salvarOuAvisar('eventoSalvar', paramsDeEvento({ ...ev, status: novoStatus }));
  }
  if (action === 'delete-event') {
    state.events = state.events.filter(ev => ev.id !== id);
    state.confirmDeleteId = null;
    delete state.reportData[id];
    if (state.expandedReportEventId === id) state.expandedReportEventId = null;
    render();
    await salvarOuAvisar('eventoRemover', { id });
  }
});

loadInitial();
</script>
</body>
</html>
