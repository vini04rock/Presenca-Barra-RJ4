  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 28px 16px 60px;
    position: relative;
    z-index: 1;
  }
  h1, h2, h3, .display {
    font-family: 'Rye', serif;
    font-weight: 400;
    letter-spacing: 0.01em;
    margin: 0;
  }
  .crest-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 18px;
  }
  .crest-wrap img {
    width: 108px;
    height: 108px;
    object-fit: contain;
    margin-bottom: 10px;
  }
  .crest-wrap h1 { font-size: 21px; color: var(--white-strong); line-height: 1.3; }
  .crest-wrap .sub { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; font-family: 'IBM Plex Sans', sans-serif; letter-spacing: 0.04em; }
  .ring-divider {
    height: 5px;
    border-top: 1px solid var(--line-strong);
    border-bottom: 1px solid var(--line);
    margin: 20px 0;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .event-card {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .event-card:active { background: var(--surface-alt); }
  .event-card .name { font-size: 18px; font-family: 'Rye', serif; font-weight: 400; color: var(--white-strong); padding-right: 56px; }
  .event-card .meta { font-size: 12px; color: var(--text-muted); margin-top: 5px; font-family: 'IBM Plex Sans', sans-serif; }
  .event-card .arrow { color: var(--text-muted); font-size: 20px; font-family: 'IBM Plex Sans', sans-serif; }
  .event-date-badge {
    position: absolute;
    top: 12px;
    right: 14px;
    font-size: 10.5px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    padding: 2px 7px;
  }
  .empty {
    text-align: center;
    padding: 40px 16px;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.7;
  }
  .btn {
    display: inline-block;
    background: var(--white-strong);
    color: #0A0A0A;
    border: 1px solid var(--white-strong);
    border-radius: var(--radius);
    padding: 12px 18px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    cursor: pointer;
    text-align: center;
  }
  .btn:active { opacity: 0.8; }
  .btn.secondary {
    background: transparent;
    border: 1px solid var(--line-strong);
    color: var(--text);
  }
  .btn.ghost {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    text-decoration: underline;
    padding: 8px 0;
  }
  .btn.block { display: block; width: 100%; }
  .btn.danger { background: transparent; border: 1px solid var(--danger-line); color: #C9A29C; }
  .row-gap { display: flex; gap: 8px; flex-wrap: wrap; }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-muted);
    font-size: 13.5px;
    margin-bottom: 18px;
    cursor: pointer;
  }
  /* Para elementos que ficam direto sobre a foto de fundo, sem um card solido
     atras: ganham uma base escura propria para nao perder contraste. */
  .on-photo {
    background: var(--surface);
    border-radius: var(--radius);
  }
  .back-link.on-photo,
  .btn.ghost.on-photo {
    border: 1px solid var(--line);
    padding: 8px 14px;
    text-decoration: none;
  }
  /* .btn.ghost e .btn.secondary tem duas classes cada, o que da mais peso do
     que .on-photo sozinha - sem isso, o fundo transparente delas vencia e so
     a borda aparecia. */
  .btn.ghost.on-photo,
  .btn.secondary.on-photo {
    background: var(--surface);
  }
  input, select, textarea {
    width: 100%;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: var(--radius);
    padding: 11px 12px;
    font-size: 15px;
    font-family: 'IBM Plex Sans', sans-serif;
    margin-bottom: 10px;
  }
  input:focus { outline: 1px solid var(--line-strong); }
  textarea { resize: vertical; font-family: 'IBM Plex Sans', sans-serif; }
  .info-line { font-size: 14px; color: var(--text); padding: 4px 0; line-height: 1.5; }
  label {
    font-size: 12px;
    color: var(--text-muted);
    display: block;
    margin-bottom: 5px;
    letter-spacing: 0.02em;
  }
  .field { margin-bottom: 14px; }
  .event-header {
    margin-bottom: 18px;
  }
  .event-header h1 { font-size: 22px; color: var(--white-strong); }
  .event-header .count-box {
    display: inline-block;
    border: 1px solid var(--line-strong);
    padding: 2px 8px;
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'IBM Plex Sans', sans-serif;
    letter-spacing: 0.03em;
    margin-top: 6px;
    border-radius: var(--radius);
  }
  .member-row {
    border-bottom: 1px solid var(--line);
    padding: 13px 0;
  }
  .member-row:last-child { border-bottom: none; }
  .division-subheader {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px 12px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    padding: 16px 0 6px;
  }
  .division-subheader:first-child { padding-top: 4px; }
  .division-subheader.clicavel { cursor: pointer; }
  .division-subheader.clicavel:active { opacity: 0.7; }
  .division-counts {
    font-weight: 500;
    letter-spacing: normal;
    font-variant-numeric: tabular-nums;
  }
  .division-counts b { color: var(--white-strong); font-weight: 700; }
  .member-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    gap: 10px;
  }
  .member-info-wrap { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .member-info { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .member-num { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .member-name { font-size: 15.5px; font-weight: 500; color: var(--text); }
  .member-funcoes {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 11.5px;
    color: var(--text-muted);
  }
  .member-funcoes .funcao-item { display: inline-flex; align-items: center; gap: 3px; }
  .grade-box {
    display: inline-block;
    border: 1px solid var(--line-strong);
    padding: 0px 6px;
    font-size: 10.5px;
    color: var(--text-muted);
    font-family: 'IBM Plex Sans', sans-serif;
    letter-spacing: 0.03em;
    border-radius: var(--radius);
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .status-aguardando { color: var(--text-muted); border: 1px dashed var(--line-strong); background: transparent; }
  .status-confirmado { color: #0A0A0A; background: var(--white-strong); border: 1px solid var(--white-strong); font-weight: 700; }
  .status-falta { color: var(--text-muted); background: var(--surface-alt); border: 1px solid var(--line); text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .status-familia { color: var(--text-muted); background: var(--surface-alt); border: 1px solid var(--line); text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .status-trabalho { color: var(--text-muted); background: var(--surface-alt); border: 1px solid var(--line); text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .picker {
    margin-top: 12px;
    padding: 12px;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    display: none;
  }
  .picker.open { display: block; }
  .picker-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .picker-btn {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    padding: 10px 8px;
    border-radius: var(--radius);
    font-size: 13.5px;
    font-family: 'IBM Plex Sans', sans-serif;
    cursor: pointer;
    text-align: left;
  }
  .picker-btn.active { border-color: var(--white-strong); background: rgba(245,243,236,0.08); }
  .toggle-row { display: flex; gap: 6px; }
  .toggle-chip {
    flex: 1;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-muted);
    padding: 8px 4px;
    border-radius: var(--radius);
    font-size: 11.5px;
    cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .toggle-chip.active { color: var(--text); border-color: var(--line-strong); background: rgba(255,255,255,0.06); }
  .legend {
    margin-top: 24px;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 2;
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
  .pin-input {
    text-align: center;
    font-size: 24px;
    letter-spacing: 10px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-size: 13px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    cursor: pointer;
  }
  .tab.active { color: var(--white-strong); border-color: var(--white-strong); }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14.5px;
  }
  .checkbox-row:last-child { border-bottom: none; }
  .checkbox-row input { width: auto; margin: 0; }
  .count-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
  .count-box-report {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 10px;
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .count-box-report b { color: var(--white-strong); font-size: 13.5px; }
  .presenca-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 14px 16px;
  }
  .presenca-nome { font-size: 15px; font-weight: 500; color: var(--text); }
  .presenca-contagem { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .presenca-sem-dados { font-size: 12px; color: var(--text-muted); font-style: italic; }
  .presenca-pct-wrap { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .presenca-barra {
    width: 64px;
    height: 6px;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .presenca-barra-fill { height: 100%; background: var(--white-strong); }
  .presenca-pct {
    font-size: 15px;
    font-weight: 700;
    color: var(--white-strong);
    font-variant-numeric: tabular-nums;
    min-width: 36px;
    text-align: right;
  }
  .chip-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 14px; }
  .chip-grid.wide { grid-template-columns: repeat(2, 1fr); }
  .chip-option {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-muted);
    padding: 9px 6px;
    border-radius: var(--radius);
    font-size: 13px;
    font-family: 'IBM Plex Sans', sans-serif;
    cursor: pointer;
    text-align: center;
  }
  .chip-option.active { color: #0A0A0A; background: var(--white-strong); border-color: var(--white-strong); font-weight: 600; }
  .footer-admin { text-align: center; margin-top: 34px; }
  .footer-admin .brand-tag { font-size: 10.5px; color: var(--line-strong); letter-spacing: 0.08em; margin-top: 14px; font-family: 'IBM Plex Sans', sans-serif; }
  .loading { text-align: center; padding: 60px 0; color: var(--text-muted); font-size: 14px; }
  .alert {
    border: 1px solid var(--danger-line);
    border-left-width: 3px;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .alert.info { border-color: var(--line-strong); }
  .alert.ok { border-color: var(--white-strong); }
  .alert-title {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--white-strong);
    margin-bottom: 4px;
  }
  .alert-msg { font-size: 12.5px; color: var(--text-muted); line-height: 1.6; }
  .member-row.travado { opacity: 0.4; pointer-events: none; }
</style>

// CONFIGURACAO DA RJ4
// Cada item vira um botao proprio no Modo organizador, com o proprio PIN
// (guardado no Code.gs, nao aqui - ver verificarPin). A chave e o que fica
// gravado como categoria dos eventos e divisao dos membros criados dali.
// Para acrescentar uma divisao nova, e so um item a mais nesta lista, mais
// o PIN dela nas Propriedades do Script - nao precisa mexer em mais nada.
// ========================================================================
const CLUBE_NOME = 'Insanos MC';
const ESCOPOS = [
  { chave: 'barra', nome: 'Barra - RJ4' },
  { chave: 'oeste', nome: 'Oeste - RJ4' },
  { chave: 'recreio', nome: 'Recreio - RJ4' },
  { chave: 'curicica', nome: 'Curicica - RJ4' },
  { chave: 'taquara', nome: 'Taquara - RJ4' },
  { chave: 'gardenia', nome: 'Gardênia - RJ4' },
  { chave: 'regional', nome: 'Regional RJ4' },
];
function escopoPorChave(chave) { return ESCOPOS.find(e => e.chave === chave) || ESCOPOS[0]; }

// Ordem pra listar as divisoes nas telas (organizador, tela inicial, rank):
// Regional no topo, depois as demais em ordem alfabetica do nome. Separado
// da ordem de declaracao de ESCOPOS, que fica com Barra primeiro por ser o
// valor padrao seguro (escopoPorChave cai nela se receber uma chave invalida).
function escoposEmOrdemDeExibicao() {
  return [...ESCOPOS].sort((a, b) => {
    if (a.chave === 'regional') return -1;
    if (b.chave === 'regional') return 1;
    return a.nome.localeCompare(b.nome);
  });
}

const TIPOS_EVENTO = ['Bate e Volta', 'Pub', 'Ação Social'];

function emojiTipoEvento(tipo) { return EMOJI_TIPO_EVENTO[tipo] || ''; }

function funcaoPorChave(chave) { return FUNCOES.find(f => f.chave === chave); }

};

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

const API_URL = 'https://script.google.com/macros/s/AKfycbyotQH6FypFdkC6D42WQHszNiuG29wqIBal2jBcwXdoCsT-Om_0gyDxFE02hxfwrZegxw/exec';

// A API do Apps Script leva de 2 a 4s numa conexao boa. No 4G do celular
// passa disso com folga, entao o limite precisa ser generoso.
const READ_TIMEOUT = 20000;
const READ_RETRIES = 2;

function jsonp(url, timeoutMs) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    let timer = null;
    const cleanup = () => {
      clearTimeout(timer);
      delete window[cbName];
      script.remove();
    };
    window[cbName] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('Falha de conexao')); };
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
    document.body.appendChild(script);
    timer = setTimeout(() => {
      if (window[cbName]) { cleanup(); reject(new Error('A conexao demorou demais')); }
    }, timeoutMs);
  });
}

// Leitura e gravacao passam pelo mesmo caminho: o backend responde confirmando
// a operacao, entao nao e mais preciso gravar as cegas e reler para conferir.
// Lanca em caso de falha, em vez de devolver vazio - devolver vazio fazia o app
// confundir "nao consegui ler" com "nao tem nada salvo".
async function api(action, params) {
  const query = Object.keys(params || {})
    .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k]))
    .join('&');
  const url = API_URL + '?action=' + encodeURIComponent(action) + (query ? '&' + query : '');

  let ultimoErro;
  for (let tentativa = 0; tentativa <= READ_RETRIES; tentativa++) {
    try {
      const r = await jsonp(url, READ_TIMEOUT);
      if (!r || !r.ok) throw new Error((r && r.erro) || 'A planilha recusou a operação');
      return r;
    } catch (e) {
      ultimoErro = e;
      console.error('Falha em', action, 'tentativa', tentativa + 1, e);
    }
  }
  throw ultimoErro;
}

// Rede de seguranca para quando a pagina esta sendo fechada: o sendBeacon e
// entregue pelo navegador mesmo depois da aba morrer. Nao da para conferir o
// resultado, mas e melhor que perder a marcacao.
function apiBeacon(action, params) {
  if (!navigator.sendBeacon) return false;
  const corpo = JSON.stringify(Object.assign({ action: action }, params));
  return navigator.sendBeacon(API_URL, new Blob([corpo], { type: 'text/plain;charset=utf-8' }));
}

// Usado nas telas do organizador, onde quem grava e uma pessoa so e um aviso
// direto resolve.
async function salvarOuAvisar(action, params) {
  try {
    return await api(action, params);
  } catch (e) {
    alert('Não consegui salvar na planilha.\n\n' + e.message + '.\n\nVerifique sua conexão e tente de novo.');
    await loadInitial();
    return null;
  }
}

async function loadInitial() {

    const r = await api('dados');
    state.roster = r.membros || [];
    state.events = r.eventos || [];
  } catch (e) {
    state.loadError = e.message;
  }

}

async function loadEventStatus(eventId) {
  state.statusLoaded = false;
  state.statusError = null;
  render();
  try {
    const r = await api('presencas', { eventoId: eventId });
    if (state.currentEventId !== eventId) return;
    state.currentStatus = r.presencas || {};
    state.statusLoaded = true;
  } catch (e) {
    if (state.currentEventId !== eventId) return;
    state.statusError = e.message;
  }
  render();
}

function getMemberStatus(memberId) {
  return state.currentStatus[memberId] || { status: 'aguardando', direto: false, destacado: false, acompanhado: false };
}

// A tela responde na hora e a gravacao corre por fora. Toques seguidos
// (status, depois Direto, depois Destacado) sao agrupados numa gravacao so.
const ESPERA_AGRUPAR = 600;
let timerGravacao = null;
let gravacaoEmCurso = false;
// Cada pendencia guarda um membro so, com o proprio eventId. Antes o app
// mandava a lista inteira de volta, e quem gravasse por ultimo apagava a
// confirmacao de quem tinha gravado antes.
let pendentes = {};

function chavePendencia(eventId, memberId) { return eventId + '|' + memberId; }

function setMemberStatus(memberId, patch) {
  // Sem a leitura confirmada, state.currentStatus pode estar vazio por falha de
  // rede, e a tela mostraria um estado que nao e o real.
  if (!state.statusLoaded) return;

  const atualizado = { ...getMemberStatus(memberId), ...patch };
  state.currentStatus = { ...state.currentStatus, [memberId]: atualizado };
  state.saveSeq++;
  state.saveState = 'saving';
  pendentes[chavePendencia(state.currentEventId, memberId)] = {
    eventoId: state.currentEventId,
    membroId: memberId,
    dados: atualizado
  };
  render();

  clearTimeout(timerGravacao);
  timerGravacao = setTimeout(gravarPendentes, ESPERA_AGRUPAR);
}

// Os parametros trafegam pela URL, entao a lista de participantes vai como
// texto separado por virgula e so os campos que o backend usa sao enviados.
function paramsDeEvento(ev) {
  return {
    id: ev.id,
    nome: ev.nome,
    data: ev.data || '',
    horario: ev.horario || '',
    endereco: ev.endereco || '',
    outros: ev.outros || '',
    status: ev.status || 'ativo',
    categoria: ev.categoria || 'barra',
    tipo: ev.tipo || '',
    membroIds: (ev.memberIds || []).join(',')
  };
}

function paramsDePresenca(p) {
  return {
    eventoId: p.eventoId,
    membroId: p.membroId,
    status: p.dados.status || 'aguardando',
    direto: !!p.dados.direto,
    destacado: !!p.dados.destacado,
    acompanhado: !!p.dados.acompanhado
  };
}

async function gravarPendentes() {
  if (gravacaoEmCurso) {
    clearTimeout(timerGravacao);
    timerGravacao = setTimeout(gravarPendentes, ESPERA_AGRUPAR);
    return;
  }
  const chaves = Object.keys(pendentes);
  if (!chaves.length) return;

  gravacaoEmCurso = true;
  const falhou = [];
  try {
    for (const chave of chaves) {
      const p = pendentes[chave];
      try {
        await api('presenca', paramsDePresenca(p));
        // So sai da fila se a mesma marcacao ainda estiver pendente: se o
        // membro mexeu de novo enquanto gravava, a nova versao fica.
        if (pendentes[chave] === p) delete pendentes[chave];
      } catch (e) {
        falhou.push(chave);
      }
    }
  } finally {
    gravacaoEmCurso = false;
  }

  state.saveState = falhou.length ? 'error' : 'saved';
  render();
  if (!falhou.length) {
    const seq = state.saveSeq;
    setTimeout(() => {
      if (seq === state.saveSeq && state.saveState === 'saved') {
        state.saveState = 'idle';
        render();
      }
    }, 2000);
  }
}

// Regera a aba Relatorio da planilha. Fica fora do caminho da confirmacao de
// propósito: gerar junto com cada marcacao dobrava o tempo que o membro espera.
async function gerarRelatorio() {
  state.relatorioState = 'gerando';
  state.relatorioErro = null;
  render();
  try {
    await api('relatorio');
    state.relatorioState = 'ok';
  } catch (e) {
    state.relatorioState = 'erro';
    state.relatorioErro = e.message;
  }
  render();
  if (state.relatorioState === 'ok') {
    setTimeout(() => {
      if (state.relatorioState === 'ok') { state.relatorioState = 'idle'; render(); }
    }, 4000);
  }
}

function gravarAgora() {
  if (!Object.keys(pendentes).length) return;
  clearTimeout(timerGravacao);
  state.saveState = 'saving';
  render();
  gravarPendentes();
}

// Se a pagina for fechada com gravacao pendente, entrega pelo beacon.
window.addEventListener('pagehide', () => {
  Object.keys(pendentes).forEach(chave => {
    apiBeacon('presenca', paramsDePresenca(pendentes[chave]));
  });
});

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : str;
  return d.innerHTML;
}

// Escapa o texto normalmente (mesma seguranca de sempre) e so depois
// transforma em link o que parecer uma URL - nunca insere HTML vindo do
// texto em si, so envolve o trecho reconhecido numa tag <a>.
function linkify(str) {
  const escapado = escapeHtml(str);
  return escapado.replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+)/gi, (match) => {
    // Pontuacao de fechamento de frase (. , ; : ! ? ) provavelmente nao faz
    // parte do link - tira do link e devolve depois dele.
    const corte = match.match(/[.,;:!?)\]]+$/);
    const sufixo = corte ? corte[0] : '';
    const url = sufixo ? match.slice(0, -sufixo.length) : match;
    const href = /^https?:\/\//i.test(url) ? url : 'https://' + url;
    return `<a href="${href}" target="_blank" rel="noopener noreferrer" style="color:#9cc4ff; text-decoration:underline; word-break:break-all;">${url}</a>${sufixo}`;
  });
}

  if (state.loadError) {
    app.innerHTML = `

      </div>

      </div>
      <button class="btn block" data-action="retry-load">Tentar de novo</button>
    `;
    return;
  }
  if (state.view === 'home') return renderHome(app);
  if (state.view === 'event') return renderEvent(app);
  if (state.view === 'rank') return renderRank(app);
  if (state.view === 'admin-divisoes') return renderDivisoes(app);
  if (state.view === 'admin-pin') return renderPin(app);
  if (state.view === 'admin') return renderAdmin(app);
}

function renderRankConteudo(d) {
  const porChave = chave => d.divisoes.find(x => x.chave === chave);
  const linhaPct = v => v === null || v === undefined ? '—' : v + '%';

  // Soma de tudo (todas as divisoes + Regional juntas) - a base de presenca
  // da RJ4 inteira, calculada em cima do que ja veio do servidor, sem
  // precisar de outra chamada.
  const totalConvites = d.divisoes.reduce((soma, x) => soma + x.convites, 0);
  const totalConfirmacoes = d.divisoes.reduce((soma, x) => soma + x.confirmacoes, 0);
  const totalPct = totalConvites ? Math.round((totalConfirmacoes / totalConvites) * 100) : null;

  const cardTotal = `
    <div class="card" style="padding: 14px 16px; margin-bottom:12px; border-color: var(--line-strong);">
      <div class="member-row" style="border-bottom:none; padding:0;">
        <div class="member-head" style="cursor:default;">
          <span class="member-name" style="font-family:'Rye',serif; font-size:17px;">🏆 Rank Total Regional</span>
          <span class="status-badge status-confirmado" style="font-size:15px; padding:7px 14px;">${linhaPct(totalPct)}</span>
        </div>
      </div>
    </div>
  `;

  const blocoDivisoes = `
    <div class="card" style="padding: 4px 16px; margin-bottom:16px;">
      ${escoposEmOrdemDeExibicao().map(e => {
        const item = porChave(e.chave);
        return `
          <div class="member-row">
            <div class="member-head">
              <span class="member-name">${escapeHtml(e.nome)}</span>
              <span class="status-badge status-confirmado">${linhaPct(item && item.percentual)}</span>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;

  const blocoMembros = escoposEmOrdemDeExibicao().map(e => {
    const membros = d.membros
      .filter(m => m.divisao === e.nome)
      .sort((a, b) => a.nome.localeCompare(b.nome));
    const aberto = state.rankExpandedDivisoes.has(e.chave);
    return `
      <div class="card" style="padding: 4px 16px;">
        <div class="division-subheader clicavel" data-action="toggle-rank-divisao" data-value="${e.chave}">
          <span>${aberto ? '▾' : '▸'} ${escapeHtml(e.nome.toUpperCase())}</span>
          <span class="division-counts">${membros.length} ${membros.length === 1 ? 'membro' : 'membros'}</span>
        </div>
        ${aberto ? (membros.length === 0 ? '<div class="empty">Nenhum membro cadastrado.</div>' : membros.map(m => `
          <div class="member-row">
            <div class="member-head">
              <span class="member-name">${escapeHtml(m.nome)}</span>
              <span class="status-badge status-confirmado">${linhaPct(m.percentual)}</span>
            </div>
          </div>
        `).join('')) : ''}
      </div>
    `;
  }).join('');

  return cardTotal + blocoDivisoes + blocoMembros;
}

  state.currentEventId = id;
  state.view = 'event';
  state.expandedMemberId = null;

}

function formatDataBR(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

const MESES_ABREV = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];

// Formato compacto para o selo do card na tela inicial - "09 SET" em vez de
// "09/09/2026", que não cabe bem num canto de card.
function formatDataCurta(iso) {
  if (!iso) return '';
  const [, m, d] = iso.split('-');
  const mesIndice = Number(m) - 1;
  if (!d || mesIndice < 0 || mesIndice > 11) return '';
  return `${d} ${MESES_ABREV[mesIndice]}`;
}

// Quanto menor o grau (I antes de X), maior o cargo - aparece primeiro.
// Quem nao tem grau cadastrado fica no fim, em ordem alfabetica.
function ordenarPorHierarquia(membros) {
  const indice = (m) => { const i = GRAUS.indexOf(m.grau); return i === -1 ? GRAUS.length : i; };
  return [...membros].sort((a, b) => indice(a) - indice(b) || a.nome.localeCompare(b.nome));
}

// So usado em eventos regionais: agrupa os participantes pela divisao de
// cada um (ordem alfabetica do nome da divisao), com a hierarquia aplicada
// dentro de cada grupo. Funciona desde ja porque cada membro ja carrega a
// propria divisao - so vai mostrar mais de um grupo quando existir membro
// de outra divisao alem da Barra.
function agruparPorDivisao(membros) {
  const porDivisao = {};
  membros.forEach(m => {
    const chave = m.divisao || 'Sem divisão';
    (porDivisao[chave] = porDivisao[chave] || []).push(m);
  });
  return Object.keys(porDivisao).sort((a, b) => a.localeCompare(b)).map(divisao => ({
    divisao,
    membros: ordenarPorHierarquia(porDivisao[divisao])
  }));
}

// Contagem ao vivo de um grupo, lida do status atual do evento aberto
// (state.currentStatus) - atualiza sozinha a cada confirmacao, igual o
// resto da tela.
function contagemGrupo(membros) {
  const c = { confirmado: 0, aguardando: 0, faltam: 0 };
  membros.forEach(m => {
    const st = getMemberStatus(m.id).status;
    if (st === 'confirmado') c.confirmado++;
    else if (st === 'familia' || st === 'trabalho') c.faltam++;
    else c.aguardando++;
  });
  return c;
}

// Clicavel: abre/fecha a lista de nomes daquela divisao. A contagem e a %
// aparecem sempre, mesmo fechado - só os nomes ficam escondidos ate abrir.
function renderSubtituloDivisao(nome, membros, aberto) {
  const c = contagemGrupo(membros);
  const pct = membros.length ? Math.round((c.confirmado / membros.length) * 100) : 0;
  return `
    <div class="division-subheader clicavel" data-action="toggle-divisao-grupo" data-value="${escapeHtml(nome)}">
      <span>${aberto ? '▾' : '▸'} ${escapeHtml(nome.toUpperCase())}</span>
      <span class="division-counts">
        ✅ ${c.confirmado} &nbsp; ⚠️ ${c.aguardando} &nbsp; ❌ ${c.faltam} &nbsp;·&nbsp; <b>${pct}%</b>
      </span>
    </div>
  `;
}

// Eventos de divisao: lista unica, ordenada por hierarquia. Eventos
// regionais: agrupados por divisao (cada grupo com o proprio subtitulo,
// contagem ao vivo e numeracao reiniciando do 01) - os nomes so aparecem na
// divisao que a pessoa abrir, pra nao rolar por todo mundo ate achar o
// proprio nome.
function renderListaMembros(ev, members) {
  if (ev.categoria === 'regional') {
    return agruparPorDivisao(members).map(grupo => {
      const aberto = state.expandedDivisoes.has(grupo.divisao);
      return `
        ${renderSubtituloDivisao(grupo.divisao, grupo.membros, aberto)}
        ${aberto ? grupo.membros.map((m, i) => renderMemberRow(m, i)).join('') : ''}
      `;
    }).join('');
  }
  return ordenarPorHierarquia(members).map((m, i) => renderMemberRow(m, i)).join('');
}

    .map(id => state.roster.find(m => m.id === id))

// Enquanto a leitura nao confirma, a lista aparece esmaecida e nao aceita
// toque: o que esta na tela ainda nao e o dado real da planilha.
function renderStatusBanner() {
  if (state.statusError) {
    return `
      <div class="alert">
        <div class="alert-title">Não consegui carregar as confirmações</div>
        <div class="alert-msg">${escapeHtml(state.statusError)}.<br>A lista abaixo não é a de verdade, por isso está bloqueada.</div>
        <button class="btn secondary block" data-action="retry-status" style="margin-top:10px;">Tentar de novo</button>
      </div>
    `;
  }
  if (!state.statusLoaded) {
    return '<div class="alert info"><div class="alert-msg">Carregando as confirmações…</div></div>';
  }
  if (state.saveState === 'saving') {
    return '<div class="alert info"><div class="alert-msg">Salvando… pode continuar marcando.</div></div>';
  }
  if (state.saveState === 'saved') {
    return '<div class="alert ok"><div class="alert-msg">✅ Salvo na planilha</div></div>';
  }
  if (state.saveState === 'error') {
    return `
      <div class="alert">
        <div class="alert-title">Ainda não salvou</div>
        <div class="alert-msg">Suas marcações estão na tela, mas não chegaram na planilha.<br>Não feche antes de salvar.</div>
        <button class="btn secondary block" data-action="retry-save" style="margin-top:10px;">Tentar salvar de novo</button>
      </div>
    `;
  }
  return '';
}

// O PIN nunca e comparado no navegador - so o servidor sabe o valor certo.
// A pagina manda o que foi digitado e recebe de volta so um sim/nao.
async function checkPin() {
  if (state.pinVerificando) return;
  const val = document.getElementById('pin-field').value.trim();
  if (!val) return;
  state.pinVerificando = true;
  state.pinErro = null;
  render();
  try {
    const r = await api('verificarPin', { escopo: state.adminEscopo, pin: val });
    if (r.valido) {
      state.isAdmin = true;
      state.view = 'admin';
      state.adminTab = 'eventos';
    } else {
      state.pinErro = 'PIN incorreto.';
    }
  } catch (e) {
    state.pinErro = 'Não consegui verificar (' + e.message + '). Tente de novo.';
  }
  state.pinVerificando = false;
  render();
}

async function loadReportData() {
  const encerrados = state.events.filter(e => e.status === 'encerrado');
  const missing = encerrados.filter(e => !(e.id in state.reportData));
  state.reportError = null;
  if (missing.length) {
    const results = await Promise.allSettled(missing.map(e => api('presencas', { eventoId: e.id })));
    missing.forEach((e, i) => {
      // Um evento sem dado fica de fora de propósito: melhor mostrar traço do
      // que um relatorio dizendo que ninguem confirmou.
      if (results[i].status === 'fulfilled') state.reportData[e.id] = results[i].value.presencas || {};
      else state.reportError = results[i].reason.message;
    });
  }
  render();
}

// Sempre recarrega ao entrar na aba: e um numero que muda a cada evento
// encerrado, diferente do relatorio por evento que so busca o que falta.
async function loadEstatisticas() {
  state.estatisticasLoading = true;
  state.estatisticasError = null;
  render();
  try {
    const r = await api('estatisticas', { categoria: state.adminEscopo });
    state.estatisticas = r.membros || [];
  } catch (e) {
    state.estatisticasError = e.message;
  }
  state.estatisticasLoading = false;
  render();
}

function renderAdminPresencas() {
  if (state.estatisticasError) {
    return `
      <div class="alert">
        <div class="alert-title">Não consegui carregar</div>
        <div class="alert-msg">${escapeHtml(state.estatisticasError)}.</div>
        <button class="btn secondary block" data-action="retry-estatisticas" style="margin-top:10px;">Tentar de novo</button>
      </div>
    `;
  }
  if (state.estatisticasLoading || !state.estatisticas) {
    return '<div class="alert info"><div class="alert-msg">Calculando presença de cada membro…</div></div>';
  }
  if (!state.estatisticas.length) {
    return '<div class="empty">Nenhum membro cadastrado ainda.</div>';
  }

  // Quem nunca teve evento encerrado (percentual null) fica no fim, sem
  // competir com quem ja tem historico de verdade.
  const lista = [...state.estatisticas].sort((a, b) => {
    if (a.percentual === null && b.percentual === null) return a.nome.localeCompare(b.nome);
    if (a.percentual === null) return 1;
    if (b.percentual === null) return -1;
    return b.percentual - a.percentual || a.nome.localeCompare(b.nome);
  });

  return `
    <div class="alert info" style="margin-bottom:16px;">
      <div class="alert-msg">Percentual de presença nos eventos já encerrados de ${escapeHtml(escopoPorChave(state.adminEscopo).nome)}. Quem entrou depois de um evento não é contado nele.</div>
    </div>
    ${lista.map(m => {
      if (m.percentual === null) {
        return `
          <div class="card presenca-row">
            <div class="presenca-nome">${escapeHtml(m.nome)}</div>
            <div class="presenca-sem-dados">Sem eventos encerrados ainda</div>
          </div>
        `;
      }
      return `
        <div class="card presenca-row">
          <div class="presenca-info">
            <div class="presenca-nome">${escapeHtml(m.nome)}</div>
            <div class="presenca-contagem">${m.confirmacoes} de ${m.convites} eventos</div>
          </div>
          <div class="presenca-pct-wrap">
            <div class="presenca-barra"><div class="presenca-barra-fill" style="width:${m.percentual}%"></div></div>
            <div class="presenca-pct">${m.percentual}%</div>
          </div>
        </div>
      `;
    }).join('')}
  `;
}

function computeCounts(ev) {
  const statusData = state.reportData[ev.id] || {};
  const counts = { confirmado: 0, familia: 0, trabalho: 0, aguardando: 0 };
  ev.memberIds.forEach(mid => {
    const s = (statusData[mid] && statusData[mid].status) || 'aguardando';
    if (counts[s] !== undefined) counts[s]++; else counts.aguardando++;
  });
  return counts;
}

function getReportGroups(ev) {
  const statusData = state.reportData[ev.id] || {};
  const groups = { confirmado: [], familia: [], trabalho: [], aguardando: [] };
  ev.memberIds.forEach(mid => {
    const m = state.roster.find(r => r.id === mid);
    if (!m) return;
    const s = (statusData[mid] && statusData[mid].status) || 'aguardando';
    (groups[s] || groups.aguardando).push(m.nome);
  });
  return groups;
}

function buildReportText(ev) {
  const groups = getReportGroups(ev);
  // Familia e trabalho sao as duas razoes de falta; juntas viram uma unica
  // secao "nao puderam ir", com o motivo ao lado de cada nome.
  const naoPuderamIr = [
    ...groups.familia.map(n => ({ nome: n, motivo: 'Família' })),
    ...groups.trabalho.map(n => ({ nome: n, motivo: 'Trabalho' })),
  ];

  const total = ev.memberIds.length;
  const percentual = total ? Math.round((groups.confirmado.length / total) * 100) : 0;

  const lines = [];
  lines.push('📋 RELATÓRIO DE PRESENÇA');
  lines.push(ev.nome);
  if (ev.data) lines.push('🗓️ ' + formatDataBR(ev.data));
  if (ev.endereco) lines.push('📍 ' + ev.endereco);
  lines.push('');
  lines.push(`📊 ${percentual}% DE PRESENÇA (${groups.confirmado.length} de ${total})`);
  lines.push('');
  lines.push(`✅ CONFIRMARAM (${groups.confirmado.length})`);
  lines.push(...(groups.confirmado.length ? groups.confirmado.map(n => '- ' + n) : ['- Ninguém confirmou']));
  lines.push('');
  lines.push(`❌ NÃO PUDERAM IR (${naoPuderamIr.length})`);
  lines.push(...(naoPuderamIr.length ? naoPuderamIr.map(m => `- ${m.nome} (${m.motivo})`) : ['- Ninguém avisou falta']));
  lines.push('');
  lines.push(`⚠️ NÃO RESPONDERAM (${groups.aguardando.length})`);
  lines.push(...(groups.aguardando.length ? groups.aguardando.map(n => '- ' + n) : ['- Todos responderam']));
  return lines.join('\n');
}

async function copyReportToClipboard(ev) {
  const text = buildReportText(ev);
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      ok = true;
    } catch (e2) {
      ok = false;
    }
  }
  if (ok) {
    state.copiedEventId = ev.id;
    render();
    setTimeout(() => {
      if (state.copiedEventId === ev.id) {
        state.copiedEventId = null;
        render();
      }
    }, 1600);
  }
}

      <div class="tab ${state.adminTab === 'presencas' ? 'active' : ''}" data-action="admin-tab" data-tab="presencas">Presenças</div>
    </div>
    <div id="admin-content"></div>
  `;
  const content = document.getElementById('admin-content');
  if (state.adminTab === 'eventos') {
    content.innerHTML = renderAdminEventos();
  } else if (state.adminTab === 'relatorio') {
    content.innerHTML = renderAdminRelatorio();
  } else if (state.adminTab === 'presencas') {
    content.innerHTML = renderAdminPresencas();
  } else {
    content.innerHTML = renderAdminMembros();
  }
}

function eventosDoEscopo() {
  return state.events.filter(ev => (ev.categoria || 'barra') === state.adminEscopo);
}

function renderAdminEventos() {
  if (state.newEventSelected !== null) {
    return renderEventForm();
  }
  const rel = state.relatorioState;
  const eventos = eventosDoEscopo();
  // A planilha inteira (aba Relatorio) cobre todas as divisoes juntas, entao
  // so faz sentido regenerar ela de dentro do Regional - quem enxerga o
  // quadro geral. Cada divisao usa o "Copiar relatorio" (por evento, na aba
  // Relatorio do organizador), que continua disponivel pra todo mundo.
  const podeGerarPlanilha = state.adminEscopo === 'regional';
  return `
    <button class="btn block" data-action="start-new-event" style="margin-bottom: 10px;">+ Criar evento</button>
    ${podeGerarPlanilha ? `
      <button class="btn secondary block on-photo" data-action="gerar-relatorio" style="margin-bottom: 6px;" ${rel === 'gerando' ? 'disabled' : ''}>
        ${rel === 'gerando' ? 'Gerando na planilha…' : '📊 Gerar relatório na planilha'}
      </button>
      ${rel === 'ok' ? '<div class="alert ok" style="margin-bottom:16px;"><div class="alert-msg">✅ Relatório atualizado na aba <b>Relatorio</b> da planilha.</div></div>' : ''}
      ${rel === 'erro' ? `<div class="alert" style="margin-bottom:16px;"><div class="alert-title">Não consegui gerar</div><div class="alert-msg">${escapeHtml(state.relatorioErro || '')}.</div></div>` : ''}
      ${rel !== 'ok' && rel !== 'erro' ? '<div style="margin-bottom:16px;"></div>' : ''}
    ` : '<div style="margin-bottom:16px;"></div>'}
    ${eventos.length === 0 ? '<div class="empty">Nenhum evento criado ainda.</div>' : eventos.map(ev => {
      const memberCount = ev.memberIds.length;
      return `
        <div class="card">
          <div style="display:flex; justify-content: space-between; align-items:flex-start;">
            <div>
              <div style="font-family:'Rye',serif; font-size:17px; color: var(--white-strong);">${escapeHtml(ev.nome)}${ev.tipo ? ' ' + emojiTipoEvento(ev.tipo) : ''}</div>
              <div style="color:var(--text-muted); font-size:12px; margin-top:5px;">${memberCount} membros · ${ev.status === 'encerrado' ? 'Encerrado' : 'Ativo'}</div>
            </div>
          </div>
          <div class="row-gap" style="margin-top:12px;">
            <button class="btn secondary" data-action="start-edit-event" data-id="${ev.id}">Editar</button>
            <button class="btn secondary" data-action="toggle-event-status" data-id="${ev.id}">${ev.status === 'encerrado' ? 'Reabrir' : 'Encerrar'}</button>
          </div>
        </div>
      `;
    }).join('')}
  `;
}

// Evento regional convida gente de todas as divisoes (Regional incluso);
// evento de uma divisao especifica so pode convidar os proprios membros.
function membrosElegiveisEvento() {
  return state.adminEscopo === 'regional' ? state.roster : membrosDoEscopo();
}

function renderEventForm() {
  const selected = state.newEventSelected;
  const isEditing = !!state.editingEventId;
  const existing = isEditing ? state.events.find(e => e.id === state.editingEventId) : null;
  const elegiveis = membrosElegiveisEvento();
  return `
    <div class="card">
      <div class="field">
        <label>Nome do evento</label>
        <input type="text" id="new-event-name" placeholder="Ex: Pub Mensal - 09SET26" value="${existing ? escapeHtml(existing.nome) : ''}">
      </div>
      <label>Tipo de evento (opcional)</label>
      <div class="chip-grid wide" style="margin-bottom: 14px;">
        ${TIPOS_EVENTO.map(t => `<button class="chip-option ${state.newEventTipo === t ? 'active' : ''}" data-action="pick-tipo-evento" data-value="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('')}
      </div>
      <div class="row-gap" style="margin-bottom: 0;">
        <div class="field" style="flex: 1; min-width: 130px;">
          <label>Data</label>
          <input type="date" id="new-event-data" value="${existing && existing.data ? existing.data : ''}">
        </div>
        <div class="field" style="flex: 1; min-width: 100px;">
          <label>Horário</label>
          <input type="time" id="new-event-horario" value="${existing && existing.horario ? existing.horario : ''}">
        </div>
      </div>
      <div class="field">
        <label>Endereço</label>
        <input type="text" id="new-event-endereco" placeholder="Ex: Av. Olegário Maciel, 101 - Barra da Tijuca" value="${existing && existing.endereco ? escapeHtml(existing.endereco) : ''}">
      </div>
      <div class="field">
        <label>Outros (opcional)</label>
        <textarea id="new-event-outros" rows="2" placeholder="Ex: link do mapa, horário de destacamento, observações">${existing && existing.outros ? escapeHtml(existing.outros) : ''}</textarea>
      </div>
      <div style="display:flex; align-items:baseline; justify-content:space-between; gap:8px;">
        <label style="margin-bottom:0;">Quem participa</label>
        ${elegiveis.length > 0 ? `
          <div>
            <span class="btn ghost" style="padding:0;" data-action="marcar-todos-membros">Marcar todos</span>
            <span style="color:var(--text-muted);"> · </span>
            <span class="btn ghost" style="padding:0;" data-action="desmarcar-todos-membros">Desmarcar todos</span>
          </div>
        ` : ''}
      </div>
      <div style="max-height: 260px; overflow-y: auto; margin: 5px 0 12px;">
        ${elegiveis.length === 0 ? '<div class="empty">Cadastre membros primeiro, na aba Membros.</div>' : elegiveis.map(m => `
          <div class="checkbox-row">
            <input type="checkbox" id="chk-${m.id}" data-id="${m.id}" class="new-event-checkbox" ${selected.has(m.id) ? 'checked' : ''}>
            <label for="chk-${m.id}" style="margin:0; font-size:14.5px; color:var(--text);">${escapeHtml(m.nome)}${m.grau ? ' (' + escapeHtml(m.grau) + ')' : ''}</label>
          </div>
        `).join('')}
      </div>
      <div class="row-gap">
        <button class="btn" data-action="save-new-event">${isEditing ? 'Salvar alterações' : 'Criar evento'}</button>
        <button class="btn secondary" data-action="cancel-new-event">Cancelar</button>
      </div>
    </div>
  `;
}

// So os membros da divisao (ou Regional) que o organizador esta gerenciando
// agora - mesma logica de eventosDoEscopo(), pro organizador de uma divisao
// nao ver nem poder mexer nos membros de outra.
function membrosDoEscopo() {
  const nome = escopoPorChave(state.adminEscopo).nome;
  return state.roster.filter(m => m.divisao === nome);
}

function renderAdminMembros() {
  const membros = membrosDoEscopo();
  const editando = !!state.editingMemberId;
  return `
    <div class="card">
      ${editando ? '<label style="display:block; margin-bottom:8px; color:var(--text-muted); font-size:12px;">Editando membro</label>' : ''}
      <div class="field">
        <label>Nome</label>
        <input type="text" id="new-member-nome" placeholder="Ex: Costa" value="${escapeHtml(state.newMemberNome)}">
      </div>
      <label>Grau (opcional)</label>
      <div class="chip-grid">
        ${GRAUS.map(g => `<button class="chip-option ${state.newMemberGrau === g ? 'active' : ''}" data-action="pick-grau" data-value="${g}">${g}</button>`).join('')}
      </div>
      <label>Função (opcional, pode marcar mais de uma)</label>
      <div class="row-gap" style="margin-bottom: 14px;">
        ${FUNCOES.map(f => `<button class="toggle-chip ${state.newMemberFuncoes.has(f.chave) ? 'active' : ''}" data-action="toggle-funcao" data-value="${f.chave}" style="flex: none; padding: 8px 12px;">${f.selo} ${escapeHtml(f.label)}</button>`).join('')}
      </div>
      ${editando ? `
        <div class="row-gap">
          <button class="btn" data-action="save-member-edit">Salvar alterações</button>
          <button class="btn secondary" data-action="cancel-member-edit">Cancelar</button>
        </div>
      ` : `<button class="btn block" data-action="add-member">+ Adicionar membro</button>`}
    </div>
    ${membros.length === 0 ? '<div class="empty">Nenhum membro cadastrado ainda.</div>' : membros.map(m => `
      <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding: 12px 16px;">
        <div>
          <div style="font-weight:500; font-size:15px;">${escapeHtml(m.nome)} ${selosFuncoes(m.funcoes)}</div>
          <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">${[m.grau, m.divisao].filter(Boolean).map(escapeHtml).join(' · ') || '—'}</div>
        </div>
        <div class="row-gap" style="margin-bottom:0;">
          <button class="btn ghost" data-action="edit-member" data-id="${m.id}">Editar</button>
          <button class="btn ghost" data-action="remove-member" data-id="${m.id}">Remover</button>
        </div>
      </div>
    `).join('')}
  `;
}

// Selos compactos de funcao, usados na lista de Membros (aba do organizador).
function selosFuncoes(funcoes) {
  if (!funcoes || !funcoes.length) return '';
  return funcoes.map(chave => {
    const f = funcaoPorChave(chave);
    return f ? `<span class="grade-box" title="${escapeHtml(f.label)}">${f.selo}</span>` : '';
  }).join(' ');
}

// Linha propria de funcao, so com os selos - usada na lista de participantes
// de um evento, numa linha separada do nome e dos status de confirmacao
// (Direto/Destacado/Acompanhado), para nao virar uma sopa de emoji dificil de
// distinguir o que e o que. O significado de cada selo fica na legenda, no
// rodape da tela do evento - mesmo padrao dos outros emojis do app.
function linhaFuncoes(funcoes) {
  if (!funcoes || !funcoes.length) return '';
  const itens = funcoes.map(chave => {
    const f = funcaoPorChave(chave);
    return f ? `<span class="funcao-item" title="${escapeHtml(f.label)}">${f.selo}</span>` : '';
  }).filter(Boolean).join('');
  return itens ? `<div class="member-funcoes">${itens}</div>` : '';
}

// ---------- ACTIONS ----------

document.getElementById('app').addEventListener('input', (e) => {
  if (e.target.id === 'new-member-nome') {
    state.newMemberNome = e.target.value;
  }
});

document.getElementById('app').addEventListener('click', async (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  const id = target.dataset.id;

  if (action === 'retry-load') return loadInitial();
  if (action === 'retry-report') return loadReportData();
  if (action === 'retry-estatisticas') return loadEstatisticas();
  if (action === 'retry-save') return gravarAgora();
  if (action === 'gerar-relatorio') return gerarRelatorio();
  if (action === 'ask-delete-event') { state.confirmDeleteId = id; return render(); }
  if (action === 'cancel-delete-event') { state.confirmDeleteId = null; return render(); }
  if (action === 'retry-status') return loadEventStatus(state.currentEventId);
  if (action === 'open-event') return openEvent(id);
  if (action === 'go-home') { state.view = 'home'; state.isAdmin = false; state.adminEscopo = null; return render(); }
  if (action === 'select-home-escopo') { state.homeEscopo = target.dataset.value; state.homeTipo = null; return render(); }
  if (action === 'go-home-escolha') { state.homeEscopo = null; state.homeTipo = null; state.view = 'home'; return render(); }
  if (action === 'select-home-tipo') { state.homeTipo = target.dataset.value; return render(); }
  if (action === 'go-home-tipos') { state.homeTipo = null; return render(); }
  if (action === 'go-rank') { state.view = 'rank'; return render(); }
  if (action === 'calcular-rank') return carregarRank();
  if (action === 'set-rank-janela') {
    state.rankJanela = target.dataset.value;
    // Se ja tinha calculado antes, recalcula na hora pra nova janela -
    // senao so troca a selecao, esperando o toque em "Calcular rank".
    return state.rankData ? carregarRank() : render();
  }
  if (action === 'toggle-rank-divisao') {
    const chave = target.dataset.value;
    if (state.rankExpandedDivisoes.has(chave)) state.rankExpandedDivisoes.delete(chave);
    else state.rankExpandedDivisoes.add(chave);
    return render();
  }
  if (action === 'go-divisoes') { state.view = 'admin-divisoes'; return render(); }
  if (action === 'select-divisao') {
    state.adminEscopo = target.dataset.value;
    state.view = 'admin-pin';
    state.pinErro = null;
    return render();
  }
  if (action === 'check-pin') return checkPin();
  if (action === 'admin-tab') {
    state.adminTab = target.dataset.tab;
    state.newEventSelected = null;
    state.editingEventId = null;
    state.confirmDeleteId = null;
    state.editingMemberId = null;
    state.newMemberNome = '';
    state.newMemberGrau = null;
    state.newMemberFuncoes = new Set();
    render();
    if (target.dataset.tab === 'relatorio') await loadReportData();
    if (target.dataset.tab === 'presencas') await loadEstatisticas();
    return;
  }
  if (action === 'toggle-report-event') {
    state.expandedReportEventId = state.expandedReportEventId === id ? null : id;
    return render();
  }
  if (action === 'copy-report') {
    const ev = state.events.find(e => e.id === id);
    if (ev) await copyReportToClipboard(ev);
    return;
  }

  if (action === 'toggle-member') {
    state.expandedMemberId = state.expandedMemberId === id ? null : id;
    return render();
  }
  if (action === 'toggle-divisao-grupo') {
    const nome = target.dataset.value;
    if (state.expandedDivisoes.has(nome)) state.expandedDivisoes.delete(nome);
    else state.expandedDivisoes.add(nome);
    return render();
  }
  if (action === 'set-status') return setMemberStatus(id, { status: target.dataset.status });
  if (action === 'toggle-direto') {
    const cur = getMemberStatus(id);
    return setMemberStatus(id, { direto: !cur.direto });
  }
  if (action === 'toggle-destacado') {
    const cur = getMemberStatus(id);
    return setMemberStatus(id, { destacado: !cur.destacado });
  }
  if (action === 'toggle-acompanhado') {
    const cur = getMemberStatus(id);
    return setMemberStatus(id, { acompanhado: !cur.acompanhado });
  }

  if (action === 'pick-grau') {
    state.newMemberGrau = state.newMemberGrau === target.dataset.value ? null : target.dataset.value;
    return render();
  }
  if (action === 'toggle-funcao') {
    const chave = target.dataset.value;
    if (state.newMemberFuncoes.has(chave)) state.newMemberFuncoes.delete(chave);
    else state.newMemberFuncoes.add(chave);
    return render();
  }
  if (action === 'add-member') {
    const nome = (document.getElementById('new-member-nome').value || '').trim();
    if (!nome) return;
    // O membro herda a divisao de onde o organizador entrou - inclusive
    // Regional, que tem os proprios membros (mesa regional).
    const member = {
      id: genId(), nome, grau: state.newMemberGrau || '', divisao: escopoPorChave(state.adminEscopo).nome,
      funcoes: Array.from(state.newMemberFuncoes)
    };
    state.roster = [...state.roster, member];
    state.newMemberGrau = null;
    state.newMemberFuncoes = new Set();
    state.newMemberNome = '';
    render();
    await salvarOuAvisar('membroSalvar', { ...member, funcoes: member.funcoes.join(',') });
  }
  if (action === 'edit-member') {
    const m = state.roster.find(x => x.id === id);
    if (!m) return;
    state.editingMemberId = id;
    state.newMemberNome = m.nome;
    state.newMemberGrau = m.grau || null;
    state.newMemberFuncoes = new Set(m.funcoes || []);
    return render();
  }
  if (action === 'cancel-member-edit') {
    state.editingMemberId = null;
    state.newMemberNome = '';
    state.newMemberGrau = null;
    state.newMemberFuncoes = new Set();
    return render();
  }
  if (action === 'save-member-edit') {
    const nome = (document.getElementById('new-member-nome').value || '').trim();
    if (!nome) return;
    const original = state.roster.find(x => x.id === state.editingMemberId);
    if (!original) return;
    // Divisao nao muda por aqui - so nome, grau e funcoes.
    const member = {
      ...original, nome, grau: state.newMemberGrau || '',
      funcoes: Array.from(state.newMemberFuncoes)
    };
    state.roster = state.roster.map(x => x.id === member.id ? member : x);
    state.editingMemberId = null;
    state.newMemberGrau = null;
    state.newMemberFuncoes = new Set();
    state.newMemberNome = '';
    render();
    await salvarOuAvisar('membroSalvar', { ...member, funcoes: member.funcoes.join(',') });
  }
  if (action === 'remove-member') {
    state.roster = state.roster.filter(m => m.id !== id);
    render();
    await salvarOuAvisar('membroRemover', { id });
  }

  if (action === 'start-new-event') {
    state.newEventSelected = new Set(membrosElegiveisEvento().map(m => m.id));
    state.editingEventId = null;
    state.newEventTipo = null;
    return render();
  }
  if (action === 'start-edit-event') {
    const ev = state.events.find(e => e.id === id);
    if (!ev) return;
    state.editingEventId = id;
    state.newEventSelected = new Set(ev.memberIds);
    state.newEventTipo = ev.tipo || null;
    return render();
  }
  if (action === 'cancel-new-event') {
    state.newEventSelected = null;
    state.editingEventId = null;
    state.newEventTipo = null;
    return render();
  }
  if (action === 'marcar-todos-membros' || action === 'desmarcar-todos-membros') {
    // Mexe direto nos checkboxes, sem re-renderizar - o estado deles so e
    // lido de verdade na hora de salvar (ver save-new-event).
    const ligar = action === 'marcar-todos-membros';
    document.querySelectorAll('.new-event-checkbox').forEach(c => { c.checked = ligar; });
    return;
  }
  if (action === 'pick-tipo-evento') {
    state.newEventTipo = state.newEventTipo === target.dataset.value ? null : target.dataset.value;
    return render();
  }
  if (action === 'save-new-event') {
    const nome = document.getElementById('new-event-name').value.trim();
    const data = document.getElementById('new-event-data').value;
    const horario = document.getElementById('new-event-horario').value;
    const endereco = document.getElementById('new-event-endereco').value.trim();
    const outros = document.getElementById('new-event-outros').value.trim();
    const checked = Array.from(document.querySelectorAll('.new-event-checkbox:checked')).map(c => c.dataset.id);
    if (!nome || checked.length === 0) return;
    const evento = {
      id: state.editingEventId || genId(),
      nome, memberIds: checked, data, horario, endereco, outros,
      tipo: state.newEventTipo || '',
      // A categoria vem de qual botao o organizador entrou (Barra ou
      // Regional), nao de uma escolha manual no formulario.
      categoria: state.adminEscopo,
      status: state.editingEventId
        ? (state.events.find(e => e.id === state.editingEventId) || {}).status || 'ativo'
        : 'ativo'
    };
    state.events = state.editingEventId
      ? state.events.map(ev => ev.id === evento.id ? { ...ev, ...evento } : ev)
      : [...state.events, evento];
    state.newEventSelected = null;
    state.editingEventId = null;
    state.newEventTipo = null;
    render();
    await salvarOuAvisar('eventoSalvar', paramsDeEvento(evento));
  }
  if (action === 'toggle-event-status') {
    const ev = state.events.find(e => e.id === id);
    if (!ev) return;
    const novoStatus = ev.status === 'encerrado' ? 'ativo' : 'encerrado';
    state.events = state.events.map(e => e.id === id ? { ...e, status: novoStatus } : e);
    render();
    await salvarOuAvisar('eventoSalvar', paramsDeEvento({ ...ev, status: novoStatus }));
  }
  if (action === 'delete-event') {
    state.events = state.events.filter(ev => ev.id !== id);
    state.confirmDeleteId = null;
    delete state.reportData[id];
    if (state.expandedReportEventId === id) state.expandedReportEventId = null;
    render();
    await salvarOuAvisar('eventoRemover', { id });
  }
});

loadInitial();
</script>
</body>
</html>
